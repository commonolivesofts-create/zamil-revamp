openapi: 3.1.0
info:
  title: Zamil Revamp API
  version: 0.1.0
  description: >-
    Backend API for the Zamil Revamp modernization. Exposes the operational
    foundation and the authentication foundation (password login with
    database-backed cookie sessions); business endpoints are documented here as
    they are implemented. Standards: server/docs/02-API_DEVELOPMENT_STANDARDS.md.


    **Browser security model.** Authentication uses an opaque, HttpOnly, Secure
    session cookie. Every state-changing request is subject to an Origin check
    (a present Origin or Referer must be the API's own origin or an allowlisted
    origin, and `Sec-Fetch-Site: cross-site` is refused). Authenticated
    state-changing requests also require the session-bound `X-CSRF-Token`
    header, obtained from the login response or `GET /api/v1/auth/csrf`.
    Interactive Swagger requests pass through the same controls.
servers:
  - url: /
    description: Current host
tags:
  - name: Health
    description: Process and dependency health checks for runtime supervision.
  - name: Authentication
    description: >-
      Password login, current session and logout. Login username is the employee
      master USER_NAME; passwords are verified against the local Argon2id hash.
      Multi-factor verification is not yet available: accounts that require it
      cannot sign in until it is implemented.
paths:
  /api/v1/auth/password/policy:
    get:
      operationId: getPasswordPolicy
      tags: [Authentication]
      summary: Password policy
      description: >-
        Returns the approved password policy for new passwords. No authentication
        required. Login itself verifies the submitted password as typed and does
        not re-apply complexity rules.
      responses:
        '200':
          description: The password policy.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PasswordPolicy'
              example:
                success: true
                data:
                  minLength: 8
                  maxLength: 128
                  requireUppercase: true
                  requireLowercase: true
                  requireDigit: true
                  requireSpecialCharacter: true
                  expiryDays: 90
                  expiryReminderDays: [14, 7, 1]
                meta:
                  requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Sign in with username and password
      description: >-
        Resolves `username` case-insensitively (after trimming) to exactly one
        employee-master record, links it by employee number to one local account,
        and verifies the password with Argon2id. On success a new session is
        created (8-hour absolute lifetime, 30-minute idle timeout) and returned
        as an HttpOnly, Secure session cookie; any session cookie already sent by
        the browser is revoked.


        Sign-in requires an ACTIVE account, `CURRENT_EMP_FLAG = 'Y'` and a
        termination date that is either absent or after today's date in
        Asia/Riyadh (a termination date of today refuses sign-in).


        Every credential, account-state and employment-eligibility failure
        returns the same `401 AUTHENTICATION_FAILED` response, so the response
        never reveals whether a username exists or why it was refused. Five
        consecutive wrong passwords lock the account for 15 minutes. `403`
        responses are returned only after the correct password was supplied.
        Failed and denied attempts are recorded in the security audit log
        (`LOGIN_FAILED`, `ACCOUNT_LOCKED`) independently of the rejected request.


        Rate limited per client IP (default 60 attempts per minute, per server
        process). No CSRF token is required (there is no session yet); the
        Origin check applies.


        **MFA.** When MFA is mandatory (Zaid, protected administrator roles, any
        effective security-administration permission) or voluntarily enrolled,
        a correct password does **not** create a session: the response is
        `authenticated: false` with an MFA challenge (10-minute, single-use,
        HttpOnly `__Host-zr_mfa` cookie plus its CSRF token). Complete it with
        `POST /api/v1/auth/mfa/verify`, or for a first-time authenticator with
        `/mfa/enrollment` and `/mfa/enrollment/confirm`. The consecutive-failure
        counter is reset only after MFA succeeds. If the server has no MFA key,
        such accounts receive `403 MFA_REQUIRED` (fail closed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: >-
            Either signed in (`authenticated: true`; the session cookie is set and
            the body contains the profile, session limits, password expiry and the
            CSRF token), or the password was correct and MFA is still required
            (`authenticated: false`; only the MFA challenge cookie is set).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: >-
                Signed in: `__Host-zr_session=<opaque token>; Path=/; Expires=<absolute
                expiry>; HttpOnly; Secure; SameSite=Lax`. MFA required:
                `__Host-zr_mfa=<opaque challenge token>; Path=/; Expires=<challenge
                expiry>; HttpOnly; Secure; SameSite=Lax`. Cookie names are configurable.
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/LoginResult'
                          - $ref: '#/components/schemas/MfaChallenge'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Sign-in failed. Deliberately identical for every failure reason.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: AUTHENTICATION_FAILED
                  message: Sign-in failed. Check your username and password, or try again later.
                meta:
                  requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '403':
          description: >-
            The password was correct but no session or challenge can be issued.
            `MFA_REQUIRED`: MFA is required but the server has no MFA key
            configured (fail closed). `PASSWORD_EXPIRED`: the password is 90 or
            more days old, or no password-change time is recorded.
            `CSRF_REJECTED`: the Origin check failed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                mfaRequired:
                  value:
                    success: false
                    error:
                      code: MFA_REQUIRED
                      message: >-
                        This account requires multi-factor verification, which is not
                        available right now. Contact your administrator.
                    meta:
                      requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
                passwordExpired:
                  value:
                    success: false
                    error:
                      code: PASSWORD_EXPIRED
                      message: Your password has expired and must be changed before you can sign in.
                    meta:
                      requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/mfa/enrollment:
    post:
      operationId: startMfaEnrollment
      tags: [Authentication]
      summary: Start first-time authenticator enrollment
      description: >-
        For a user in an MFA challenge who has no authenticator yet. Returns the
        TOTP secret and `otpauth://` URI to show once (for example as a QR code).
        Nothing is stored until `/mfa/enrollment/confirm` proves possession. The
        secret is derived from the challenge, so repeating this call within the
        same challenge returns the same secret; a new sign-in gives a new one.
        Never replaces an existing authenticator (`409 MFA_ALREADY_ENROLLED`).
      security:
        - mfaChallengeCookie: []
      parameters:
        - $ref: '#/components/parameters/MfaCsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Enrollment secret (shown once; never logged).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MfaEnrollment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/MfaChallengeInvalid'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '409':
          $ref: '#/components/responses/MfaConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/MfaUnavailable'
  /api/v1/auth/mfa/enrollment/confirm:
    post:
      operationId: confirmMfaEnrollment
      tags: [Authentication]
      summary: Confirm authenticator enrollment and sign in
      description: >-
        Verifies a code from the new authenticator (proof of possession), stores
        the encrypted secret, revokes every other session of the user (MFA change)
        and issues an MFA-verified session. A wrong code counts toward the
        5-failure / 15-minute lockout.
      security:
        - mfaChallengeCookie: []
      parameters:
        - $ref: '#/components/parameters/MfaCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
      responses:
        '200':
          $ref: '#/components/responses/MfaSignedIn'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/MfaVerificationFailed'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '409':
          $ref: '#/components/responses/MfaConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/MfaUnavailable'
  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMfa
      tags: [Authentication]
      summary: Verify an authenticator code and sign in
      description: >-
        Verifies a 6-digit TOTP code (SHA-1, 30-second steps, ±1 step tolerance)
        for the challenge's user. Each time step is accepted only once (replays
        are refused). On success the challenge is revoked and an MFA-verified
        session is issued (15-minute idle timeout for privileged users, 30 minutes
        otherwise). Wrong or replayed codes count toward the lockout; a lock ends
        the challenge.
      security:
        - mfaChallengeCookie: []
      parameters:
        - $ref: '#/components/parameters/MfaCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
      responses:
        '200':
          $ref: '#/components/responses/MfaSignedIn'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/MfaVerificationFailed'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '409':
          $ref: '#/components/responses/MfaConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/MfaUnavailable'
  /api/v1/auth/mfa/replacement:
    post:
      operationId: startMfaReplacement
      tags: [Authentication]
      summary: Start replacing the enrolled authenticator
      description: >-
        For a signed-in user whose MFA was verified on the current session within
        the last 10 minutes (sign in again otherwise). Returns a new candidate TOTP
        secret, derived under a separate purpose from enrollment and bound to this
        session and the stored secret; nothing is stored until
        `/mfa/replacement/confirm`. Refusals are audited as `ACCESS_DENIED`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: New authenticator setup material (shown once; never logged).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MfaEnrollment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/MfaRecentVerificationRequired'
        '409':
          $ref: '#/components/responses/MfaConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/MfaUnavailable'
  /api/v1/auth/mfa/replacement/confirm:
    post:
      operationId: confirmMfaReplacement
      tags: [Authentication]
      summary: Confirm the new authenticator and replace the old one
      description: >-
        Verifies a code from the NEW authenticator, then atomically replaces the
        stored secret (only if it is unchanged since it was read) and revokes every
        session and MFA challenge of the user, including the current session. Both
        cookies are cleared; sign in again with the password and the new
        authenticator. Codes from the old authenticator are never accepted again.
        Recorded as `SESSION_REVOKED` with reason `MFA_REPLACED`. A wrong code is
        audited as `ACCESS_DENIED` and counts toward the 5-failure lockout; a
        lockout ends every session of the user.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
      responses:
        '200':
          description: Authenticator replaced; all sessions revoked and cookies cleared.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: Session and MFA challenge cookies cleared.
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MfaReplacementResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/MfaVerificationFailed'
        '403':
          $ref: '#/components/responses/MfaRecentVerificationRequired'
        '409':
          $ref: '#/components/responses/MfaConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/MfaUnavailable'
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Authentication]
      summary: Current user and session
      description: >-
        Returns the signed-in user's safe profile and session state. The session,
        account status, employment eligibility and MFA requirement are re-checked
        in the database on every request; a session whose account was disabled,
        whose employee became ineligible (including a termination date reaching
        today in Asia/Riyadh), or whose user now requires MFA is revoked
        (`SESSION_REVOKED`). Absolute and idle expiry are recorded as
        `SESSION_EXPIRED`. An expired password does not end a valid session; it
        is reported in `password.expired`. No business permission is required.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The current user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [Authentication]
      summary: CSRF token for the current session
      description: >-
        Returns the synchronizer token bound to the current session, for clients
        that did not keep the token from the login response (for example after a
        page reload). Send it in the `X-CSRF-Token` header on authenticated
        state-changing requests.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The CSRF token.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CsrfToken'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: Sign out
      description: >-
        Revokes the current session in the database, clears the session cookie and
        records the logout in the security audit log. Requires the `X-CSRF-Token`
        header.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Signed out. The session cookie is cleared.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Liveness probe
      description: >-
        Confirms that the API process is running and able to respond. Does not
        check Oracle or any other dependency. No authentication required.
      responses:
        '200':
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Liveness'
              example:
                success: true
                data:
                  status: UP
                meta:
                  requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '500':
          $ref: '#/components/responses/InternalError'
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Readiness probe
      description: >-
        Confirms that the instance can serve work: both Oracle connection pools
        (LOW and HIGH) must complete a bounded, read-only check. Results are reused
        for a short period and concurrent requests share one check, so frequent
        probes cannot exhaust the pools. No authentication required. Database
        identities, hosts and driver errors are never returned.
      responses:
        '200':
          description: The instance is ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Readiness'
              example:
                success: true
                data:
                  status: READY
                  database:
                    LOW: UP
                    HIGH: UP
                meta:
                  requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '503':
          description: A required database pool is unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: SERVICE_UNAVAILABLE
                  message: The service is not ready
                  details:
                    - field: database.HIGH
                      message: Database pool is unavailable
                meta:
                  requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-zr_session
      description: >-
        Opaque session token set by `POST /api/v1/auth/login` (HttpOnly; the
        browser sends it automatically). The cookie name is deployment
        configurable. This scheme describes authentication only; it does not
        imply any business permission.
    mfaChallengeCookie:
      type: apiKey
      in: cookie
      name: __Host-zr_mfa
      description: >-
        Opaque MFA challenge token set by `POST /api/v1/auth/login` after a correct
        password when MFA is required. Valid for 10 minutes, single use, accepted
        only by the `/api/v1/auth/mfa/*` endpoints and never as a session.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF token from the login response or `GET /api/v1/auth/csrf`.
      schema:
        type: string
    MfaCsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Challenge-bound CSRF token from the login response that issued the challenge.
      schema:
        type: string
  headers:
    RequestId:
      description: >-
        Request correlation ID. A valid incoming X-Request-Id (8–64 characters of
        A–Z, a–z, 0–9, '.', '_' or '-') is reused; otherwise a UUID is generated.
      schema:
        type: string
  schemas:
    PasswordPolicy:
      type: object
      required:
        - minLength
        - maxLength
        - requireUppercase
        - requireLowercase
        - requireDigit
        - requireSpecialCharacter
        - expiryDays
        - expiryReminderDays
      properties:
        minLength:
          type: integer
          description: Minimum length in Unicode code points.
        maxLength:
          type: integer
        requireUppercase:
          type: boolean
        requireLowercase:
          type: boolean
        requireDigit:
          type: boolean
        requireSpecialCharacter:
          type: boolean
          description: Any character that is not a letter or digit, including a space.
        expiryDays:
          type: integer
          description: Password age at which a new login is refused.
        expiryReminderDays:
          type: array
          items:
            type: integer
          description: Days before expiry at which reminders are sent (reminders are not yet implemented).
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
          description: Employee-master USER_NAME; matched case-insensitively after trimming.
        password:
          type: string
          minLength: 1
          maxLength: 256
          format: password
          description: Verified exactly as typed (not trimmed).
    AuthUser:
      type: object
      required: [id, username, employeeNumber, fullName, email, jobTitle, department]
      properties:
        id:
          type: string
          description: Local account ID (NUMBER(19,0), transported as a string to preserve precision).
          examples: ['105']
        username:
          type: [string, 'null']
        employeeNumber:
          type: string
        fullName:
          type: [string, 'null']
        email:
          type: [string, 'null']
        jobTitle:
          type: [string, 'null']
        department:
          type: [string, 'null']
    SessionInfo:
      type: object
      required: [expiresAt, idleTimeoutSeconds, mfaVerified]
      properties:
        expiresAt:
          type: string
          format: date-time
          description: Absolute session expiry (UTC).
        idleTimeoutSeconds:
          type: integer
          description: Inactivity period after which the session ends (accurate to about one minute).
        mfaVerified:
          type: boolean
    PasswordState:
      type: object
      required: [expired, expiresAt]
      properties:
        expired:
          type: boolean
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: When the password reaches 90 days (UTC); null if its change time is unknown.
    CsrfToken:
      type: object
      required: [token, headerName]
      properties:
        token:
          type: string
        headerName:
          type: string
          const: X-CSRF-Token
    MfaChallenge:
      type: object
      required: [authenticated, mfa, csrf]
      properties:
        authenticated:
          const: false
        mfa:
          type: object
          required: [required, enrollmentRequired, expiresAt]
          properties:
            required:
              const: true
            enrollmentRequired:
              type: boolean
              description: True when no authenticator is set up yet (use the enrollment endpoints).
            expiresAt:
              type: string
              format: date-time
              description: Challenge expiry (UTC), 10 minutes after the password was verified.
        csrf:
          $ref: '#/components/schemas/CsrfToken'
    MfaEnrollment:
      type: object
      required:
        [secret, otpauthUri, issuer, accountName, algorithm, digits, periodSeconds, expiresAt]
      properties:
        secret:
          type: string
          description: >-
            Base32 TOTP secret (160 bits). Show once; never store client-side or copy
            into chats, tickets or logs.
        otpauthUri:
          type: string
          description: >-
            Key URI for authenticator apps (render as a QR code). The label is
            `<issuer>:<accountName>`, each URL-encoded, joined by a literal colon.
        issuer:
          type: string
          description: Issuer shown by the authenticator app.
        accountName:
          type: string
          description: Account name shown by the authenticator app (the USER_NAME).
        algorithm:
          const: SHA1
        digits:
          const: 6
        periodSeconds:
          const: 30
        expiresAt:
          type: string
          format: date-time
          description: >-
            Confirm before this time: the challenge expiry (enrollment), or 10 minutes
            after MFA was verified on the session (replacement).
    MfaReplacementResult:
      type: object
      required: [replaced, sessionsRevoked, reauthenticationRequired]
      properties:
        replaced:
          const: true
        sessionsRevoked:
          type: integer
          description: Sessions and challenges of the user revoked, including the current session.
        reauthenticationRequired:
          const: true
    MfaCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^\d{6}$'
          description: The current 6-digit code from the authenticator app.
    LoginResult:
      type: object
      required: [authenticated, user, session, password, csrf]
      properties:
        authenticated:
          const: true
        user:
          $ref: '#/components/schemas/AuthUser'
        session:
          $ref: '#/components/schemas/SessionInfo'
        password:
          $ref: '#/components/schemas/PasswordState'
        csrf:
          $ref: '#/components/schemas/CsrfToken'
    CurrentUser:
      type: object
      required: [user, session, password]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        session:
          $ref: '#/components/schemas/SessionInfo'
        password:
          $ref: '#/components/schemas/PasswordState'
    ResponseMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          description: Correlation ID, identical to the X-Request-Id response header.
    SuccessResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          const: true
        data:
          description: Endpoint-specific payload.
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ErrorResponse:
      type: object
      required: [success, error, meta]
      properties:
        success:
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable error code for client-side handling.
              examples: [VALIDATION_ERROR, RESOURCE_NOT_FOUND, INTERNAL_ERROR]
            message:
              type: string
              description: Safe, user-displayable message.
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    Liveness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: UP
    Readiness:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          const: READY
        database:
          type: object
          required: [LOW, HIGH]
          properties:
            LOW:
              type: string
              const: UP
            HIGH:
              type: string
              const: UP
  responses:
    MfaSignedIn:
      description: >-
        MFA verified and signed in. The session cookie is set (with
        `mfaVerified: true`) and the MFA challenge cookie is cleared.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Set-Cookie:
          description: Session cookie set; `__Host-zr_mfa` cleared.
          schema:
            type: string
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessResponse'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResult'
    MfaChallengeInvalid:
      description: >-
        No usable MFA challenge (missing, expired, used, or the account is no
        longer eligible). Sign in again.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: MFA_CHALLENGE_INVALID
              message: Your sign-in has expired or is no longer valid. Sign in again.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    MfaVerificationFailed:
      description: >-
        `MFA_VERIFICATION_FAILED`: wrong, expired or replayed code (counted toward
        the lockout). `MFA_CHALLENGE_INVALID`: no usable challenge.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: MFA_VERIFICATION_FAILED
              message: The verification code is incorrect, expired or already used.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    MfaRecentVerificationRequired:
      description: >-
        `MFA_RECENT_VERIFICATION_REQUIRED`: MFA was not verified on this session
        within the last 10 minutes (or not at all). `CSRF_REJECTED`: the Origin or
        X-CSRF-Token check failed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: MFA_RECENT_VERIFICATION_REQUIRED
              message: Sign in again with your authenticator, then make this change within 10 minutes.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    MfaConflict:
      description: >-
        `MFA_ENROLLMENT_REQUIRED`: no authenticator yet (use the enrollment
        endpoints). `MFA_ALREADY_ENROLLED`: an authenticator exists and cannot be
        enrolled again (use the replacement endpoints from an MFA-verified
        session). `MFA_REPLACEMENT_CONFLICT`: the stored authenticator changed
        concurrently; nothing was replaced by this request.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: MFA_ALREADY_ENROLLED
              message: An authenticator is already set up for this account.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    MfaUnavailable:
      description: MFA cannot be completed (no MFA key configured, or a stored secret is unreadable).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: MFA_UNAVAILABLE
              message: >-
                Multi-factor verification is temporarily unavailable. Contact your
                administrator.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    ValidationError:
      description: Request validation failed. Submitted values are never echoed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: username
                  message: username is required
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    Unauthenticated:
      description: >-
        No valid session (missing, unknown, expired, idle, revoked, or no longer
        eligible). The session cookie is cleared when one was sent.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHENTICATED
              message: Authentication is required
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    CsrfRejected:
      description: >-
        The Origin check or the X-CSRF-Token check failed. A token failure on an
        authenticated session is audited as `ACCESS_DENIED`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: CSRF_REJECTED
              message: The request could not be verified. Reload and try again.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    RateLimited:
      description: Too many login attempts from this client.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Seconds until another attempt is accepted.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: Too many attempts. Please wait and try again.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    ServiceUnavailable:
      description: The database is temporarily unavailable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: SERVICE_UNAVAILABLE
              message: The service is temporarily unavailable
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    InternalError:
      description: Unexpected server error. Internal details are never returned.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
