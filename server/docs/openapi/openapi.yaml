        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404':
          description: Employee not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/charters/{headerId}:
    get:
      operationId: getProjectCharter
      tags: [Project Charters]
      summary: Get a Project Charter
      description: Requires an authenticated session and `HR.PROJECT_CHARTERS:VIEW`.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: headerId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ProjectCharterId' }
      responses:
        '200':
          description: Project Charter details, milestones, and reward-existence indicator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectCharterDetailResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404':
          description: Project Charter not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: updateProjectCharter
      tags: [Project Charters]
      summary: Update a Project Charter
      description: >-
        Requires `HR.PROJECT_CHARTERS:UPDATE`, an authenticated session, and
        `X-CSRF-Token`. Only a `Pending` charter can be updated. The existing linked idea must
        still be approved; the request cannot reassign the charter to a different idea.
        `expectedEndDate` must be on or after `expectedStartDate`.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: headerId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ProjectCharterId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCharterUpdate' }
      responses:
        '200':
          description: Updated Project Charter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectCharterDetailResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404':
          description: Project Charter not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Charter is not Pending or can no longer be updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteProjectCharter
      tags: [Project Charters]
      summary: Delete a Project Charter
      description: >-
        Requires `HR.PROJECT_CHARTERS:DELETE`, an authenticated session, and
        `X-CSRF-Token`. Only a `Pending` charter can be deleted. Its reward and charter rows are
        deleted in the same transaction.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: headerId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ProjectCharterId' }
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '200':
          description: Delete row counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectCharterDeleteResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404':
          description: Project Charter not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Charter is not Pending and cannot be deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
