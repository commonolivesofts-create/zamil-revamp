      security: [{ sessionCookie: [] }]
      parameters:
        - { name: flag, in: query, required: true, schema: { type: string, enum: [Y, N] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - name: status
          in: query
          description: Legacy label, case-insensitive; stored statuses are matched as legacy labels them.
          schema: { type: string, enum: [Draft, Inprocess, Approved, Rejected] }
        - { name: empNo, in: query, schema: { type: string, maxLength: 50 } }
        - { name: empType, in: query, schema: { type: string, maxLength: 50 } }
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, schema: { type: string, format: date } }
        - {
            name: sortBy,
            in: query,
            schema:
              {
                type: string,
                enum: [HEADER_ID, ORIENTATION_DURATION_FROM, EMPLOYEE_NAME, CREATION_DATE],
                default: HEADER_ID,
              },
          }
        - { name: sortDir, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Page of records and total count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
                  data: { type: array, items: { $ref: '#/components/schemas/OrientationTraining' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createOrientationTraining
      tags: [HR Orientation Trainings]
      summary: Create an orientation training record
      description: >-
        Inserts the header, registry row and all lines atomically, in the PRODUCTION tables as the
        legacy form does (its variant flag is never set; no shared-service marker exists in this
        schema). Status is Draft. The employee fields come from the employee master, To equals
        From, Scheduled By is the signed-in user, Orientation Days (to - from) and Orientation Time
        ("H.MM Hrs") are computed; body values for them are ignored. HR users may choose any
        current employee, other users only themselves (403). HEADER_ID, DEP_LINE_ID and the registry ID come from the tables'
        identity columns. Requires `HR.ORIENTATION_TRAININGS:CREATE`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrientationTrainingCreate' }
      responses:
        '201':
          description: Created record identifiers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [headerId, flag, reference]
                    properties:
                      headerId: { $ref: '#/components/schemas/Id' }
                      flag: { type: string, enum: [Y, N] }
                      reference: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
