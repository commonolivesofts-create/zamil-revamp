  responses:
    WorkflowFormResult:
      description: The registered form as stored.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessResponse'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WorkflowForm'
    WorkflowDataSourceResult:
      description: The registered data source as stored.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessResponse'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WorkflowDataSource'
    WorkflowNotFound:
      description: The form or data source does not exist.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RESOURCE_NOT_FOUND
              message: Form not found
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    WorkflowConflict:
      description: >-
        `FORM_CODE_EXISTS` / `SOURCE_CODE_EXISTS`: the code is already registered.
        `STALE_RECORD`: the record changed since it was read (reload and retry).
        `SOURCE_IDENTITY_LOCKED`: the source identity cannot change after source
        versions exist. `CSRF_REJECTED` is a 403.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: STALE_RECORD
              message: The form was changed by someone else. Reload it and apply your change again.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    MfaSignedIn:
      description: >-
        MFA verified and signed in. The session cookie is set (with
        `mfaVerified: true`) and the MFA challenge cookie is cleared.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Set-Cookie:
          description: Session cookie set; `__Host-zr_mfa` cleared.
          schema:
            type: string
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessResponse'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResult'
    MfaChallengeInvalid:
      description: >-
        No usable MFA challenge (missing, expired, used, or the account is no
        longer eligible). Sign in again.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: MFA_CHALLENGE_INVALID
              message: Your sign-in has expired or is no longer valid. Sign in again.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    MfaVerificationFailed:
      description: >-
        `MFA_VERIFICATION_FAILED`: wrong, expired or replayed code (counted toward
        the lockout). `MFA_CHALLENGE_INVALID`: no usable challenge.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: MFA_VERIFICATION_FAILED
              message: The verification code is incorrect, expired or already used.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    MfaRecentVerificationRequired:
      description: >-
        `MFA_RECENT_VERIFICATION_REQUIRED`: MFA was not verified on this session
        within the last 5 minutes (or not at all). `CSRF_REJECTED`: the Origin or
        X-CSRF-Token check failed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: MFA_RECENT_VERIFICATION_REQUIRED
              message: Sign in again with your authenticator, then make this change within 5 minutes.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    MfaConflict:
      description: >-
        `MFA_ENROLLMENT_REQUIRED`: no authenticator yet (use the enrollment
        endpoints). `MFA_ALREADY_ENROLLED`: an authenticator exists and cannot be
        enrolled again (use the replacement endpoints from an MFA-verified
        session). `MFA_REPLACEMENT_CONFLICT`: the stored authenticator changed
        concurrently; nothing was replaced by this request.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: MFA_ALREADY_ENROLLED
              message: An authenticator is already set up for this account.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    MfaUnavailable:
      description: MFA cannot be completed (no MFA key configured, or a stored secret is unreadable).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: MFA_UNAVAILABLE
              message: >-
                Multi-factor verification is temporarily unavailable. Contact your
                administrator.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    ValidationError:
      description: Request validation failed. Submitted values are never echoed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: username
                  message: username is required
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    Unauthenticated:
      description: >-
        No valid session (missing, unknown, expired, idle, revoked, or no longer
        eligible). The session cookie is cleared when one was sent.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHENTICATED
              message: Authentication is required
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    CsrfRejected:
      description: >-
        The Origin check or the X-CSRF-Token check failed. A token failure on an
        authenticated session is audited as `ACCESS_DENIED`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: CSRF_REJECTED
              message: The request could not be verified. Reload and try again.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    RateLimited:
      description: Too many login attempts from this client.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Seconds until another attempt is accepted.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: Too many attempts. Please wait and try again.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    ServiceUnavailable:
      description: The database is temporarily unavailable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: SERVICE_UNAVAILABLE
              message: The service is temporarily unavailable
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    AccessDenied:
      description: >-
        Refused. `FORBIDDEN`: the session lacks the permission (default deny, explicit DENY, inactive catalogue item or MFA not verified). Administration rules: `PROTECTED_ROLE`, `PROTECTED_ACCOUNT`, `PROTECTED_CATALOG`, `SUPER_ADMINISTRATOR_ONLY`, `SELF_MODIFICATION_FORBIDDEN`, `PRIVILEGE_ESCALATION_FORBIDDEN`. `CSRF_REJECTED`: origin or token check failed. Every refusal is audited as `ACCESS_DENIED`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: You do not have permission for this action.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    NotFound:
      description: >-
        The role, user, module, resource or permission does not exist.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RESOURCE_NOT_FOUND
              message: The role was not found
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    Conflict:
      description: >-
        `CONFLICT`: the code already exists (unique key). `INACTIVE_TARGET`: the role or permission chain is not active.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: CONFLICT
              message: A role with this code already exists
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    ProbationEvaluationDeleteConflict:
      description: The evaluation cannot be deleted because its REQUEST_STATUS is not DRAFT.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: PROBATION_EVALUATION_NOT_DRAFT
              message: Only draft probation evaluations can be deleted
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    ProbationEvaluationUpdateConflict:
      description: The evaluation cannot be updated because its REQUEST_STATUS is INPROCESS or APPROVED.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: PROBATION_EVALUATION_NOT_DRAFT
              message: Only draft or rejected probation evaluations can be updated
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    UserConflict:
      description: >-
        `ACCOUNT_EXISTS`, `EMPLOYEE_NOT_ELIGIBLE` (reason in details),
        `ACTIVATION_PREREQUISITES_NOT_MET` (unmet prerequisites in details) or
        `CONFLICT` (the account changed concurrently).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: ACTIVATION_PREREQUISITES_NOT_MET
              message: The account cannot be activated yet
              details:
                - field: account
                  message: PASSWORD_NOT_SET
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    InterviewAssessmentDeleteConflict:
      description: >-
        `CANNOT_DELETE_APPROVED`: the record's STATUS is 'Approved' and its
        evaluation is 'Passed', so the Employment Offer form consumes it and it
        cannot be deleted. Nothing was removed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: CANNOT_DELETE_APPROVED
              message: Cannot delete an approved interview assessment
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    RequisitionUpdateConflict:
      description: >-
        `CANNOT_UPDATE_STATUS`: a non-HR caller tried to update a requisition whose
        REQUISITION_STATUS is 'Inprocess' or 'Approved' (README Â§5.0); HR users may
        always save. Nothing was changed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: CANNOT_UPDATE_STATUS
              message: Request is InProcess/Approved â€” cannot update data
            meta:
              requestId: 7c4e9a1b-2d3f-4a5b-8c6d-9e0f1a2b3c4d
    RequisitionDeleteConflict:
      description: >-
        One of the two uniform delete guards fired (README Â§5.1 â€” no bypass, HR
        included): `CANNOT_DELETE_STATUS` when REQUISITION_STATUS is not 'Draft',
        or `REQUISITION_IN_USE` when an interview assessment references the
        requisition number in ATTRIBUTE4. Nothing was removed â€” the header, its
        attachment rows and the physical files are untouched.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notDraft:
              summary: The requisition is not a Draft
              value:
                success: false
                error:
                  code: CANNOT_DELETE_STATUS
                  message: Only Draft requisitions can be deleted
                meta:
                  requestId: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
            referencedByInterview:
              summary: An interview assessment references the requisition number
              value:
                success: false
                error:
                  code: REQUISITION_IN_USE
                  message: >-
                    This requisition is referenced by an interview assessment and
                    cannot be deleted
                meta:
                  requestId: 9d8c7b6a-5f4e-4b3a-a2c1-d0e9f8a7b6c5
    RecoveryError:
      description: >-
        `VALIDATION_ERROR`, `TOKEN_INVALID` (unknown, expired, used, revoked or
        wrong-purpose token: one message), `PASSWORD_POLICY_VIOLATION` (unmet rules
        in details), `PASSWORD_REUSED` or `CONFIRMATION_MISMATCH`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: TOKEN_INVALID
              message: This link is invalid or has expired. Request a new one.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    RecoveryRefused:
      description: >-
        `RECOVERY_FAILED` (token, account or password check failed),
        `MFA_VERIFICATION_FAILED`, `CURRENT_PASSWORD_INVALID`,
        `ACCOUNT_NOT_ELIGIBLE` or `CSRF_REJECTED`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RECOVERY_FAILED
              message: The recovery could not be completed.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    RecoveryNotApplicable:
      description: >-
        `RECOVERY_NOT_APPLICABLE` with the reason in details (for example
        `ACCOUNT_ACTIVE`, `PASSWORD_ALREADY_SET`, `MFA_NOT_ENROLLED`, an
        employee-eligibility reason) or `CONFLICT`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RECOVERY_NOT_APPLICABLE
              message: This action does not apply to the account
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    RecoveryThrottled:
      description: >-
        A link of this type was sent to the account within the last 5 minutes.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RECOVERY_THROTTLED
              message: A message was sent recently. Wait a few minutes before sending another.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    DeliveryUnavailable:
      description: >-
        Office 365 SMTP is not enabled, no approved recipient exists for the account
        (privileged accounts need separate approval; missing EMAIL_ADDRESS), the
        TEST-recipient override could not prove the TEST database, or SMTP refused
        or failed the message. No usable token remains. Details (administrators
        only) carry `NO_CHANNEL_CONFIGURED`, `RECIPIENT_UNAVAILABLE`,
        `DATABASE_IDENTITY_UNVERIFIED`, `RECIPIENT_NOT_PERMITTED`,
        `LINK_NOT_CONFIGURED` or `DELIVERY_FAILED`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: DELIVERY_UNAVAILABLE
              message: Account recovery messages cannot be sent right now. Contact your administrator.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    InternalError:
      description: Unexpected server error. Internal details are never returned.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
