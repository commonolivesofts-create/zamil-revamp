  /api/v1/hr/orientation-trainings/{headerId}:
    get:
      operationId: getOrientationTraining
      tags: [HR Orientation Trainings]
      summary: Read an orientation training record
      description: >-
        Resolves the table pair (see the flag parameter) and returns header with lines. Requires
        `HR.ORIENTATION_TRAININGS:VIEW`. Record access (also for PUT, DELETE and line DELETE): the
        creator, an HR user (XXZP_HR lookup) or a user in the trained employee's department
        (XX_DIGI_EMP_MASTER.ORGANIZATION_ID) holding `HR.ORIENTATION_TRAININGS:VIEW`; anyone else
        receives 403 `FORBIDDEN`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: headerId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
        - name: flag
          in: query
          schema: { type: string, enum: [Y, N] }
          description: >-
            Variant of the record (legacy form/{id}/{Y|N}); the two variants number their records
            independently. Without it the registry is used, then the table that holds the ID.
      responses:
        '200':
          description: Header and ordered lines.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
                  data: { $ref: '#/components/schemas/OrientationTraining' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: updateOrientationTraining
      tags: [HR Orientation Trainings]
      summary: Update an orientation training record
      description: >-
        Updates the header and replaces all lines atomically; sets STATUS to Draft (legacy: a
        rejected request is corrected and re-submitted), LAST_UPDATED_BY and LAST_UPDATE_DATE.
        Scheduled By keeps its value. Returns 409 `ORIENTATION_TRAINING_NOT_DRAFT` when the
        record is Inprocess or Approved and 403 outside the record access rule (see GET). Requires
        `HR.ORIENTATION_TRAININGS:UPDATE`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: headerId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
        - name: flag
          in: query
          schema: { type: string, enum: [Y, N] }
          description: >-
            Variant of the record (legacy form/{id}/{Y|N}); the two variants number their records
            independently. Without it the registry is used, then the table that holds the ID.
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrientationTrainingUpdate' }
      responses:
        '200': { description: Header updated. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteOrientationTraining
      tags: [HR Orientation Trainings]
      summary: Delete a draft orientation training record
      description: Deletes lines, header, and variant registry row atomically. Non-draft records return 409. Requires `HR.ORIENTATION_TRAININGS:DELETE`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: headerId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
        - name: flag
          in: query
          schema: { type: string, enum: [Y, N] }
          description: >-
            Variant of the record (legacy form/{id}/{Y|N}); the two variants number their records
            independently. Without it the registry is used, then the table that holds the ID.
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
