        jobTitle:
          type: [string, 'null']
        accountStatus:
          enum: [PENDING, ACTIVE, DISABLED]
        locked:
          type: boolean
        mfaEnrolled:
          type: boolean
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    PaginatedUsers:
      type: object
      required: [success, data, pagination, meta]
      properties:
        success:
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserListItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    EmployeeCandidate:
      type: object
      properties:
        employeeNumber:
          type: string
        username:
          type: [string, 'null']
        fullName:
          type: [string, 'null']
        department:
          type: [string, 'null']
        jobTitle:
          type: [string, 'null']
        currentEmployeeFlag:
          type: [string, 'null']
        terminationStatus:
          enum: [NONE, FUTURE, ENDED]
        userId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        accountStatus:
          type: [string, 'null']
        provisionable:
          type: boolean
        ineligibilityReason:
          description: >-
            EMPLOYEE_AMBIGUOUS, EMPLOYEE_NOT_CURRENT, EMPLOYEE_TERMINATED,
            USERNAME_MISSING or USERNAME_AMBIGUOUS; null when eligible.
          type: [string, 'null']
    PaginatedCandidates:
      type: object
      required: [success, data, pagination, meta]
      properties:
        success:
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeCandidate'
        pagination:
          $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ProvisionRequest:
      type: object
      additionalProperties: false
      required: [employeeNumber]
      properties:
        employeeNumber:
          type: string
          maxLength: 30
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
          description: XX_DIGI_EMP_MASTER.EMPLOYEE_NUMBER.
    UserDetail:
      type: object
      description: >-
        Never contains PASSWORD_HASH, MFA secrets or token values. Change responses
        add `changed` (false for a no-op) and, for disable, `sessionsRevoked`.
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        employeeNumber:
          type: string
        account:
          type: object
          properties:
            status:
              enum: [PENDING, ACTIVE, DISABLED]
            locked:
              type: boolean
            lockedUntil:
              type: [string, 'null']
              format: date-time
            failedLoginAttempts:
              type: integer
            lastFailedLoginAt:
              type: [string, 'null']
              format: date-time
            lastLoginAt:
              type: [string, 'null']
              format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: [string, 'null']
              format: date-time
        password:
          type: object
          properties:
            set:
              type: boolean
            changedAt:
              type: [string, 'null']
              format: date-time
            expiresAt:
              type: [string, 'null']
              format: date-time
            expired:
              type: [boolean, 'null']
        mfa:
          type: object
          properties:
            enrolled:
              type: boolean
            enrolledAt:
              type: [string, 'null']
              format: date-time
        employee:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                username:
                  type: [string, 'null']
                fullName:
                  type: [string, 'null']
                email:
                  type: [string, 'null']
                jobTitle:
                  type: [string, 'null']
                department:
                  type: [string, 'null']
                currentEmployeeFlag:
                  type: [string, 'null']
                terminationStatus:
                  enum: [NONE, FUTURE, ENDED]
        eligibility:
          type: object
          properties:
            eligible:
              type: boolean
            reason:
              type: [string, 'null']
        classification:
          type: object
          properties:
            protectedSuperAdministrator:
              type: boolean
            privilegedRoleMember:
              type: boolean
            securityAdministration:
              type: boolean
            mfaRequired:
              type: boolean
        activation:
          type: object
          properties:
            ready:
              type: boolean
            unmetPrerequisites:
              type: array
              items:
                type: string
              description: Employee eligibility reasons and/or PASSWORD_NOT_SET.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
        activeSessions:
          type: array
          items:
            type: object
            properties:
              sessionId:
                $ref: '#/components/schemas/Id'
              createdAt:
                type: string
                format: date-time
              lastActivityAt:
                type: string
                format: date-time
              expiresAt:
                type: string
                format: date-time
              mfaVerified:
                type: boolean
              ipAddress:
                type: [string, 'null']
              userAgent:
                type: [string, 'null']
    SessionRevocation:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        sessionId:
          $ref: '#/components/schemas/Id'
        sessionsRevoked:
          type: integer
        revoked:
          type: boolean
        changed:
          type: boolean
    RecoveryRequest:
      type: object
      additionalProperties: false
      required: [username, purpose]
      properties:
        username:
          type: string
          maxLength: 100
        purpose:
          enum: [PASSWORD_RESET, MFA_RECOVERY]
    RecoveryAccepted:
      type: object
      properties:
        accepted:
          const: true
        message:
          type: string
    PasswordTokenRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Single-use token from the delivered link (request body only, never a URL).
        newPassword:
          type: string
          minLength: 1
          maxLength: 256
          description: Must satisfy GET /api/v1/auth/password/policy.
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
        newPassword:
          type: string
          minLength: 1
          maxLength: 256
    PasswordChangeResult:
      type: object
      properties:
        passwordChanged:
          const: true
        accountStatus:
          const: ACTIVE
        sessionsRevoked:
          type: integer
        signInRequired:
          const: true
    MfaRecoveryStartRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Single-use token from the delivered link (request body only, never a URL).
        password:
          type: string
          minLength: 1
          maxLength: 256
    MfaRecoveryConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, password, code]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Single-use token from the delivered link (request body only, never a URL).
        password:
          type: string
          minLength: 1
          maxLength: 256
        code:
          type: string
          pattern: '^[0-9]{6}$'
    MfaRecoveryResult:
      type: object
      properties:
        mfaRecovered:
          const: true
        sessionsRevoked:
          type: integer
        signInRequired:
          const: true
    PasswordSetupIssueRequest:
      type: object
      additionalProperties: false
      required: [confirmEmployeeNumber]
      properties:
        confirmEmployeeNumber:
          type: string
          maxLength: 30
          description: The employee number of the target account, re-entered as explicit authorization.
    RecoveryIssueRequest:
      type: object
      additionalProperties: false
      required: [purpose, confirmEmployeeNumber]
      properties:
        purpose:
          enum: [PASSWORD_RESET, MFA_RECOVERY]
        confirmEmployeeNumber:
          type: string
          maxLength: 30
          description: The employee number of the target account, re-entered as explicit authorization.
    TokenIssued:
      type: object
      description: Never contains the token.
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        actionType:
          enum: [PASSWORD_SETUP, PASSWORD_RESET, MFA_RECOVERY]
        expiresAt:
          type: string
          format: date-time
        delivered:
          const: true
        authorizedBySuperAdministrator:
          type: boolean
    ResponseMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          description: Correlation ID, identical to the X-Request-Id response header.
    SuccessResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          const: true
        data:
          description: Endpoint-specific payload.
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ErrorResponse:
      type: object
      required: [success, error, meta]
      properties:
        success:
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable error code for client-side handling.
              examples: [VALIDATION_ERROR, RESOURCE_NOT_FOUND, INTERNAL_ERROR]
            message:
              type: string
              description: Safe, user-displayable message.
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    Liveness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: UP
    Readiness:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          const: READY
        database:
          type: object
          required: [LOW, HIGH]
          properties:
            LOW:
              type: string
              const: UP
            HIGH:
              type: string
              const: UP
  responses:
    MfaSignedIn:
      description: >-
        MFA verified and signed in. The session cookie is set (with
        `mfaVerified: true`) and the MFA challenge cookie is cleared.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Set-Cookie:
          description: Session cookie set; `__Host-zr_mfa` cleared.
          schema:
            type: string
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessResponse'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResult'
    MfaChallengeInvalid:
      description: >-
        No usable MFA challenge (missing, expired, used, or the account is no
        longer eligible). Sign in again.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: MFA_CHALLENGE_INVALID
              message: Your sign-in has expired or is no longer valid. Sign in again.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    MfaVerificationFailed:
      description: >-
        `MFA_VERIFICATION_FAILED`: wrong, expired or replayed code (counted toward
        the lockout). `MFA_CHALLENGE_INVALID`: no usable challenge.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: MFA_VERIFICATION_FAILED
              message: The verification code is incorrect, expired or already used.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    MfaRecentVerificationRequired:
      description: >-
        `MFA_RECENT_VERIFICATION_REQUIRED`: MFA was not verified on this session
        within the last 10 minutes (or not at all). `CSRF_REJECTED`: the Origin or
        X-CSRF-Token check failed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: MFA_RECENT_VERIFICATION_REQUIRED
              message: Sign in again with your authenticator, then make this change within 10 minutes.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    MfaConflict:
      description: >-
        `MFA_ENROLLMENT_REQUIRED`: no authenticator yet (use the enrollment
        endpoints). `MFA_ALREADY_ENROLLED`: an authenticator exists and cannot be
        enrolled again (use the replacement endpoints from an MFA-verified
        session). `MFA_REPLACEMENT_CONFLICT`: the stored authenticator changed
        concurrently; nothing was replaced by this request.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: MFA_ALREADY_ENROLLED
              message: An authenticator is already set up for this account.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    MfaUnavailable:
      description: MFA cannot be completed (no MFA key configured, or a stored secret is unreadable).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: MFA_UNAVAILABLE
              message: >-
                Multi-factor verification is temporarily unavailable. Contact your
                administrator.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    ValidationError:
      description: Request validation failed. Submitted values are never echoed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - field: username
                  message: username is required
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    Unauthenticated:
      description: >-
        No valid session (missing, unknown, expired, idle, revoked, or no longer
        eligible). The session cookie is cleared when one was sent.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHENTICATED
              message: Authentication is required
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    CsrfRejected:
      description: >-
        The Origin check or the X-CSRF-Token check failed. A token failure on an
        authenticated session is audited as `ACCESS_DENIED`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: CSRF_REJECTED
              message: The request could not be verified. Reload and try again.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    RateLimited:
      description: Too many login attempts from this client.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Seconds until another attempt is accepted.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: Too many attempts. Please wait and try again.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    ServiceUnavailable:
      description: The database is temporarily unavailable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: SERVICE_UNAVAILABLE
              message: The service is temporarily unavailable
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    AccessDenied:
      description: >-
        Refused. `FORBIDDEN`: the session lacks the permission (default deny, explicit DENY, inactive catalogue item or MFA not verified). Administration rules: `PROTECTED_ROLE`, `PROTECTED_ACCOUNT`, `PROTECTED_CATALOG`, `SUPER_ADMINISTRATOR_ONLY`, `SELF_MODIFICATION_FORBIDDEN`, `PRIVILEGE_ESCALATION_FORBIDDEN`. `CSRF_REJECTED`: origin or token check failed. Every refusal is audited as `ACCESS_DENIED`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: You do not have permission for this action.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    NotFound:
      description: >-
        The role, user, module, resource or permission does not exist.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RESOURCE_NOT_FOUND
              message: The role was not found
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    Conflict:
      description: >-
        `CONFLICT`: the code already exists (unique key). `INACTIVE_TARGET`: the role or permission chain is not active.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: CONFLICT
              message: A role with this code already exists
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    UserConflict:
      description: >-
        `ACCOUNT_EXISTS`, `EMPLOYEE_NOT_ELIGIBLE` (reason in details),
        `ACTIVATION_PREREQUISITES_NOT_MET` (unmet prerequisites in details) or
        `CONFLICT` (the account changed concurrently).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: ACTIVATION_PREREQUISITES_NOT_MET
              message: The account cannot be activated yet
              details:
                - field: account
                  message: PASSWORD_NOT_SET
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    RecoveryError:
      description: >-
        `VALIDATION_ERROR`, `TOKEN_INVALID` (unknown, expired, used, revoked or
        wrong-purpose token: one message), `PASSWORD_POLICY_VIOLATION` (unmet rules
        in details), `PASSWORD_REUSED` or `CONFIRMATION_MISMATCH`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: TOKEN_INVALID
              message: This link is invalid or has expired. Request a new one.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    RecoveryRefused:
      description: >-
        `RECOVERY_FAILED` (token, account or password check failed),
        `MFA_VERIFICATION_FAILED`, `CURRENT_PASSWORD_INVALID`,
        `ACCOUNT_NOT_ELIGIBLE` or `CSRF_REJECTED`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RECOVERY_FAILED
              message: The recovery could not be completed.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    RecoveryNotApplicable:
      description: >-
        `RECOVERY_NOT_APPLICABLE` with the reason in details (for example
        `ACCOUNT_ACTIVE`, `PASSWORD_ALREADY_SET`, `MFA_NOT_ENROLLED`, an
        employee-eligibility reason) or `CONFLICT`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RECOVERY_NOT_APPLICABLE
              message: This action does not apply to the account
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    RecoveryThrottled:
      description: >-
        A link of this type was sent to the account within the last 5 minutes.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: RECOVERY_THROTTLED
              message: A message was sent recently. Wait a few minutes before sending another.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    DeliveryUnavailable:
      description: >-
        Office 365 SMTP is not enabled, no approved recipient exists for the account
        (privileged accounts need separate approval; missing EMAIL_ADDRESS), the
        TEST-recipient override could not prove the TEST database, or SMTP refused
        or failed the message. No usable token remains. Details (administrators
        only) carry `NO_CHANNEL_CONFIGURED`, `RECIPIENT_UNAVAILABLE`,
        `DATABASE_IDENTITY_UNVERIFIED`, `RECIPIENT_NOT_PERMITTED`,
        `LINK_NOT_CONFIGURED` or `DELIVERY_FAILED`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: DELIVERY_UNAVAILABLE
              message: Account recovery messages cannot be sent right now. Contact your administrator.
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
    InternalError:
      description: Unexpected server error. Internal details are never returned.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred
            meta:
              requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
