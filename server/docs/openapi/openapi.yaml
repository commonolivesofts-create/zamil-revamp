                    properties:
                      data:
                        $ref: '#/components/schemas/PasswordChangeResult'
        '400':
          $ref: '#/components/responses/RecoveryError'
        '403':
          $ref: '#/components/responses/RecoveryRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
