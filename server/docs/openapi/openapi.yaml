        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/hr/orientation-trainings:
    get:
      operationId: listOrientationTrainings
      tags: [HR Orientation Trainings]
      summary: List orientation training records
      description: >-
        Lists the requested shared-service (Y) or production (N) variant with filters and
        pagination (legacy newhiretrain_list): HR users see every record, others their own. Rows
        carry `status` as the legacy label (Draft, Inprocess, Approved, Rejected), the stored
