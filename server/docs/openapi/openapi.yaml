        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateRequisition
      tags: [HR Requisitions]
      summary: Update a requisition
      description: >-
        Full replace of the business fields of an existing requisition in ONE
        transaction (the edit form submits the whole payload). Frozen and never
        updated (README Â§5.1): REQUISITION_STATUS, REQUISITION_NUMBER, REQUEST_DATE,
        REQUESTER_NAME, REQUESTED_BY â€” requestDate is therefore rejected on this
        operation as an unknown field. Non-HR callers get 409 CANNOT_UPDATE_STATUS
        while the status is Inprocess or Approved (HR users may always save).
        Recruitment status and its dates are read-only on the form. Approved requisitions use dedicated HR actions; all status changes are audited.
        Multipart requests may append attachment file parts (`files`) in the same
        transaction. Out-of-scope rows 404. Requires `HR.REQUISITIONS:UPDATE` and
        the `X-CSRF-Token` header.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequisitionId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisitionUpdate'
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/RequisitionUpdate'
                - type: object
                  properties:
                    files:
                      type: array
                      maxItems: 10
                      items:
                        type: string
                        format: binary
