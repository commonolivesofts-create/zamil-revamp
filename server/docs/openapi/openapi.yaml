        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: updateWarningLetter
      tags: [HR Warning Letters]
      summary: Update a warning letter
      description: >-
        Requires `HR.WARNING_LETTERS:UPDATE`, an authenticated session, and `X-CSRF-Token`.
        Only writable warning-letter fields are persisted; employee snapshots, reference and
        warning numbers, status, and audit fields are server-managed. At least one reason is
        required after applying the update, and comments are required when their corresponding
        flags are `Y`. The response has `Cache-Control: no-store`.
