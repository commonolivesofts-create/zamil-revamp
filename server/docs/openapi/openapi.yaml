  /api/v1/hr/employment-offers:
    get:
      operationId: listEmploymentOffers
      tags: [Employment Offers]
      summary: List employment offers
      description: >-
        Employment Offer Form records (XXZP_EMPLOYMENT_OFFER_HEADER_T), paginated,
        with filters and an allowlisted sort. Row scoping is decided server-side
        (README Â§7.4): HR users (XX_DIGI_LOOKUP_VALUES LOOKUP_TYPE 'XXZP_HR') see
        every record and may narrow by createdBy; other users only see rows they
        created, whatever they pass in the query. STATUS is write-once 'Incomplete'
        on insert and only a filter here. Requires `HR.EMPLOYMENT_OFFERS:VIEW`
        (re-evaluated in Oracle on every request).
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
          description: >-
            Case-insensitive contains-match on employee name (English/Arabic),
            position, interview number or requisition number.
        - name: intNo
          in: query
          schema:
            type: string
            maxLength: 100
          description: Exact match on ATTRIBUTE10 (interview INT_NO).
        - name: requisitionNo
          in: query
          schema:
            type: string
            maxLength: 100
          description: Exact match on ATTRIBUTE11 (requisition number).
        - name: division
          in: query
          schema:
            enum: ['300000002689294', '300000002689307']
          description: >-
            Business-unit id. The legacy labels are contradictory (README Â§8.9), so
            the API only ever exchanges raw ids.
        - name: status
          in: query
          schema:
            type: string
            maxLength: 30
          description: >-
            STATUS filter; the only value today is 'Incomplete' (the column is
            write-once and never updated).
        - name: dateFrom
          in: query
          description: Offer-date lower bound, inclusive (calendar date).
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: Offer-date upper bound, inclusive (calendar date).
          schema:
            type: string
            format: date
        - name: createdBy
          in: query
          description: >-
            NUMBER creator as a decimal string. HR callers only; ignored for
            non-HR callers (the server-side scope wins).
          schema:
            type: string
            pattern: '^[1-9][0-9]{0,18}$'
        - name: sortBy
          in: query
          schema:
            enum: [HEADER_ID, OFFER_DATE, EMPLOYEE_NAME, CREATION_DATE]
            default: HEADER_ID
        - name: sortDir
          in: query
          schema:
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Success; rows in the sort order with a stable HEADER_ID tie-breaker.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmploymentOffers'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createEmploymentOffer
      tags: [Employment Offers]
      summary: Insert an employment offer
      description: >-
        Inserts the header (XXZP_EMPLOYMENT_OFFER_HEADER_T) and its single line
        (XXZP_EMPLOYMENT_OFFER_LINES_T) in ONE transaction: a v4 UUID is generated
        in Node, the header is inserted WITHOUT primary-key columns, the
        trigger-generated HEADER_ID is read back by UUID, then the line is inserted;
        any failure rolls the whole transaction back (README Â§3.1, Â§3.3). STATUS is
        written 'Incomplete' only and never updated. An empty applicant stores '-',
        an empty reqNo stores 0, absent probationary-period text takes the hardcoded
        defaults from the SQL (NVL), and a comma salary ("8,500") is stripped to a
        number server-side; business dates travel as 'YYYY-MM-DD' and are stored as
        'DD-Mon-YYYY'. Requires `HR.EMPLOYMENT_OFFERS:CREATE` (re-evaluated in Oracle
        on every request) and the `X-CSRF-Token` header.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmploymentOfferWrite'
      responses:
        '201':
          description: Created; the trigger-generated headerId and the insert UUID.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EmploymentOfferCreated'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
