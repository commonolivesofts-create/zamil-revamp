        permission. Audited as RBAC_OVERRIDE_REVOKED. Requires
        `SECURITY_ADMINISTRATION.USER_PERMISSION_OVERRIDES:REVOKE` (re-evaluated in
        Oracle on every request; MFA-verified session required). Requires the
        `X-CSRF-Token` header.
