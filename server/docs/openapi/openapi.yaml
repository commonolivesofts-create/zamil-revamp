  /api/v1/hr/business-visa-letters:
    get:
      operationId: listBusinessVisaLetters
      tags: [HR Business Visiting Visa Letters]
      summary: List Business Visiting Visa Letters
      description: >-
        Requires an authenticated session and
        `HR.BUSINESS_VISA_LETTERS:VIEW` (checked on every request). The response contains
        `data.letters` and the legacy pagination fields inside `data.pagination`. `limit=0`
        disables pagination and returns every matching row. The sort column and direction
        are restricted by the request validator to a fixed allowlist.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          description: Zero returns all matching records without pagination.
          schema: { type: integer, minimum: 0, maximum: 100000, default: 10 }
        - name: search
          in: query
          description: Contains search on reference number, employee name, embassy, or subject.
          schema: { type: [string, 'null'], maxLength: 200 }
        - name: ref_no
          in: query
          description: Case-insensitive contains search on reference number.
          schema: { type: [string, 'null'], maxLength: 50 }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, FINAL, ''] }
        - name: division_id
          in: query
          description: Exact division identifier.
          schema: { type: [string, 'null'], maxLength: 50 }
        - name: from
          in: query
          description: Inclusive letter-date lower bound (YYYY-MM-DD); an empty string disables the filter.
          schema:
            oneOf:
              - { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
              - { const: '' }
        - name: to
          in: query
          description: Inclusive letter-date upper bound (YYYY-MM-DD); an empty string disables the filter.
          schema:
            oneOf:
              - { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
              - { const: '' }
        - name: sort
          in: query
          description: >-
            Case-insensitive allowlist: id, ref_no, letter_date, employee_name, status,
            division_id, or created_at, optionally followed by asc or desc.
          schema:
            type: string
            default: id desc
      responses:
        '200':
          description: Matching letters and pagination metadata in the legacy response shape.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessVisaLetterListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createBusinessVisaLetter
      tags: [HR Business Visiting Visa Letters]
      summary: Create a Business Visiting Visa Letter
      description: >-
        Requires `HR.BUSINESS_VISA_LETTERS:CREATE`, an authenticated session, and
        `X-CSRF-Token`. The body accepts the documented form fields; unknown properties
        are rejected. `division_id`, `ref_no`, and `employee_name` must be supplied.
        `letter_date` defaults to the current Asia/Riyadh calendar date when omitted,
        null, or empty. The service defaults an omitted status to `DRAFT` and fills
        expense/return employee names from `employee_name`; explicitly provided status
        values are accepted as `DRAFT` or `FINAL`. Reference numbers must be unique
        case-insensitively.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessVisaLetterCreate' }
      responses:
        '201':
          description: Created letter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessVisaLetterResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Permission denied or CSRF/Origin verification failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Reference number already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
