  /api/v1/hr/warning-letters:
    get:
      operationId: listWarningLetters
      tags: [HR Warning Letters]
      summary: List warning letters
      description: >-
        Requires `HR.WARNING_LETTERS:VIEW` and an authenticated session. Results are ordered
        by the requested sort and order, with ID descending as a tie-breaker except when
        sorting by ID. Set `limit=0` to return all matching rows. The response has
        `Cache-Control: no-store`.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 0, maximum: 1000, default: 25 }
        - name: search
          in: query
          schema: { type: [string, 'null'], maxLength: 150 }
        - name: reference_no
          in: query
          schema: { type: [string, 'null'], maxLength: 50 }
        - name: warning_no
          in: query
          schema: { type: integer, minimum: 1 }
        - name: emp_no
          in: query
          schema: { type: [string, 'null'], maxLength: 80 }
        - name: division
          in: query
          schema: { type: [string, 'null'], maxLength: 150 }
        - name: status
          in: query
          schema: { type: [string, 'null'], maxLength: 30 }
        - name: flag
          in: query
          schema:
            type: string
            enum: [irregular, absent, eating, delaying, make_problems, warning_letter, other_letter]
        - name: date_from
          in: query
          schema: { $ref: '#/components/schemas/WarningLetterDate' }
        - name: date_to
          in: query
          schema: { $ref: '#/components/schemas/WarningLetterDate' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, reference_no, warning_no, emp_no, emp_name, war_date, created_at]
            default: created_at
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Paginated warning-letter records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarningLetterListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createWarningLetter
      tags: [HR Warning Letters]
      summary: Create a warning letter
      description: >-
        Requires `HR.WARNING_LETTERS:CREATE`, an authenticated session, and `X-CSRF-Token`.
        Employee snapshot fields, warning number, reference number, DRAFT status, and
        creation audit fields are assigned by the server. At least one reason is required;
        warning-letter comments are required when their corresponding flag is `Y`. The
        response has `Cache-Control: no-store`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarningLetterCreate' }
      responses:
        '201':
          description: Warning letter created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarningLetterDetailResponse' }
        '400':
          description: Request validation failed or employee was not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '409':
          description: A unique warning-letter reference number could not be generated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
