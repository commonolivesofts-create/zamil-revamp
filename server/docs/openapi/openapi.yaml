        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/hr/probation-evaluations/{headerId}:
    get:
      operationId: getProbationEvaluation
      tags: [HR Probation Evaluations]
      summary: Read a probation evaluation
      description: >-
        Returns the header and ordered evaluation lines. Requires `HR.PROBATION_EVALUATIONS:VIEW`.
        Record access (also for PUT and DELETE): the creator, an HR user (XXZP_HR lookup) or a user
        in the evaluated employee's department (XX_DIGI_EMP_MASTER.ORGANIZATION_ID) holding
        `HR.PROBATION_EVALUATIONS:VIEW`; anyone else receives 403 `FORBIDDEN`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: headerId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: Header and lines.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProbationEvaluation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      operationId: updateProbationEvaluation
      tags: [HR Probation Evaluations]
      summary: Update a probation evaluation
      description: >-
        The legacy edit form (prf_uplines.php): Comments, Suggestion and a 1â€“5 rating for every
        line of the evaluation are required, and they are all that is saved, with the computed
        TOTAL_RATING, UPDATED_BY and UPDATED_AT. Other header fields are not changed and the
        request status is kept. 400 unless the lines are exactly the evaluation's lines. Returns
        409 when the record is INPROCESS or APPROVED (DRAFT and REJECTED are editable) and 403
        outside the record access rule (see GET). Requires `HR.PROBATION_EVALUATIONS:UPDATE`
        and the X-CSRF-Token header.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: headerId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProbationEvaluationUpdateRequest' }
      responses:
        '200':
          description: Updated evaluation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          headerId: { $ref: '#/components/schemas/Id' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ProbationEvaluationUpdateConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      operationId: deleteProbationEvaluation
      tags: [HR Probation Evaluations]
      summary: Delete a draft probation evaluation
      description: >-
        Deletes lines before the header in one transaction. Returns 409 when the record
        is not DRAFT. Requires `HR.PROBATION_EVALUATIONS:DELETE` and the X-CSRF-Token header.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: headerId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Deleted draft evaluation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          headerId: { $ref: '#/components/schemas/Id' }
                          deleted: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ProbationEvaluationDeleteConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/hr/interview-assessments:
    get:
      operationId: listInterviewAssessments
      tags: [HR Interview Assessments]
      summary: List interview assessments
      description: >-
        Interview Assessment Form records (XXZP_INTERVW_ASSESMNT_HEADER_T joined to
        XXZP_INTERVIEW_EVAL_T), paginated, with filters and an allowlisted sort.
        Row scoping is decided server-side (README Â§7.4): HR users (XX_DIGI_LOOKUP_VALUES
        LOOKUP_TYPE 'XXZP_HR') see every record and may narrow by createdBy; other users
        only see rows they created, whatever they pass in the query. Requires
        `HR.INTERVIEW_ASSESSMENTS:VIEW` (re-evaluated in Oracle on every request).
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
          description: Case-insensitive contains-match on candidate name, INT_NO or position.
        - name: status
          in: query
          schema:
            enum: [Incomplete, Inprocess, Approved, Rejected]
        - name: evaluationStatus
          in: query
          schema:
            enum: [Passed, Hold, Failed]
        - name: requisitionNo
          in: query
          schema:
            type: string
            maxLength: 100
        - name: positionName
          in: query
          schema:
            type: string
            maxLength: 200
        - name: division
          in: query
          schema:
            enum: [Food, Non-Food]
        - name: interviewType
          in: query
          schema:
            enum: [Personal, Online]
        - name: dateFrom
          in: query
          description: Interview-date lower bound, inclusive (calendar date).
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: Interview-date upper bound, inclusive (calendar date).
          schema:
            type: string
            format: date
        - name: createdBy
          in: query
          description: >-
            NUMBER(19,0) creator as a decimal string. HR callers only; ignored for
            non-HR callers (the server-side scope wins).
          schema:
            type: string
            pattern: '^[1-9][0-9]{0,18}$'
        - name: sortBy
          in: query
          schema:
            enum: [HEADER_ID, INTERVIEW_DATE, CANDIDATE_NAME, CREATION_DATE]
            default: HEADER_ID
        - name: sortDir
          in: query
          schema:
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Success. `statusLabel` maps Inprocess to InProcess; anything else
            outside Approved/Rejected is 'Draft'. `evaluationStatus` is null unless the
            header STATUS is Approved.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInterviewAssessments'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createInterviewAssessment
      tags: [HR Interview Assessments]
      summary: Insert an interview assessment
      description: >-
        Inserts the header and the three section rows (XXZP_PERSONAL_SPEC_T,
        XXZP_JOB_COMPETENCY_T, XXZP_INTERVIEW_EVAL_T) in ONE transaction. The
        requisitionNo must be an approved requisition (XXZPI_PER_REQUISITIONS_ALL,
        REQUISITION_STATUS 'Approved'); the totals rate9 / cRating7 are recomputed
        server-side from the numeric ratings; empty text stores '-', empty numbers
        store 0; business dates travel as 'YYYY-MM-DD' and are stored as 'DD-Mon-YY'.
        HEADER_ID comes from the Oracle identity column (INSERT â€¦ RETURNING, no
        MAX-based key); INT_NO is ATTRIBUTE3 + '-' + that headerId zero-padded to 3,
        written in the same transaction. STATUS is written
        'Incomplete' only. Requires `HR.INTERVIEW_ASSESSMENTS:CREATE` (re-evaluated
        in Oracle on every request) and the `X-CSRF-Token` header.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewAssessmentWrite'
      responses:
        '201':
          description: Created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/InterviewAssessmentCreated'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
