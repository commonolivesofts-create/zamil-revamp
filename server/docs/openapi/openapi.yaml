        '404':
          description: The request was not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Request status does not permit deletion (STATE_CONFLICT).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/survey/meta:
    get:
      operationId: getEmployeeSurveyMeta
      tags: [Employee Survey]
      summary: Get Employee Survey form metadata
      description: >-
        Returns the configured demographics, section and question catalogue, and accepted
        answers. This route does not require authentication. Question text may be null when a
        language is not present in the stored catalogue.
      responses:
        '200':
          description: Survey metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SurveyMetaResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/survey/responses:
    post:
      operationId: createEmployeeSurveyResponse
      tags: [Employee Survey]
      summary: Submit an Employee Survey response
      description: >-
        Accepts an anonymous response and stores its header and 29 answer lines in one
        transaction. The selected language's canonical question text must exist in the
        catalogue or the request fails with `SURVEY_CATALOGUE_UNAVAILABLE` (503). The global
        origin check applies to this state-changing request; no session-bound CSRF token is
        required because this route is anonymous.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SurveySubmission' }
      responses:
        '201':
          description: Response created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SurveyCreatedResponse' }
              example:
                success: true
                data: { headerId: 42, lineCount: 29 }
                meta: { requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b }
        '400': { $ref: '#/components/responses/ValidationError' }
        '503':
          description: Canonical question text is unavailable in the selected language.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      operationId: listEmployeeSurveyResponses
      tags: [Employee Survey]
      summary: List submitted Employee Survey responses
      description: >-
        Requires an authenticated session and the existing configured survey `VIEW`
        permission. The query searches remark text case-insensitively and filters by the
        validated demographics, year, and submitted date range. Joi accepts ISO dates and
        timestamps for `from` and `to`, but the repository converts them with the date-only
        format `YYYY-MM-DD`; timestamp values may therefore fail at the database layer.
        Pagination is returned inside `data` as `page`,
        `pageSize`, `total`, and `items` (not in the shared top-level pagination envelope).
        If the application has no configured survey permission resource, the route fails
        closed and the current error handler returns an internal error.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: year
          in: query
          schema: { $ref: '#/components/schemas/SurveyListYear' }
        - name: age
          in: query
          schema: { $ref: '#/components/schemas/SurveyAge' }
        - name: jobLevel
          in: query
          schema: { $ref: '#/components/schemas/SurveyJobLevel' }
        - name: department
          in: query
          schema: { $ref: '#/components/schemas/SurveyDepartment' }
        - name: experience
          in: query
          schema: { $ref: '#/components/schemas/SurveyExperience' }
        - name: from
          in: query
          description: ISO date or date-time lower boundary, inclusive.
          schema:
            oneOf:
              - type: string
                format: date
              - type: string
                format: date-time
        - name: to
          in: query
          description: ISO date or date-time upper boundary, inclusive.
          schema:
            oneOf:
              - type: string
                format: date
              - type: string
                format: date-time
        - name: q
          in: query
          description: Case-insensitive substring search in response remarks.
          schema: { type: string, maxLength: 200 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: A page of matching survey responses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SurveyListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/survey/responses/{headerId}:
    get:
      operationId: getEmployeeSurveyResponse
      tags: [Employee Survey]
      summary: Get one submitted Employee Survey response
      description: Requires an authenticated session and the existing configured survey `VIEW` permission.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: headerId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The survey response, grouped by section.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SurveyDetailResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404':
          description: Survey response not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteEmployeeSurveyResponse
      tags: [Employee Survey]
      summary: Delete one submitted Employee Survey response
      description: >-
        Requires an authenticated session, the existing configured survey `DELETE` permission,
        and a session-bound `X-CSRF-Token`. The header and its answer lines are deleted in one
        transaction. The global origin check also applies.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: headerId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '200':
          description: The survey response and its answer lines were deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SurveyDeleteResponse' }
              example:
                success: true
                data: { headers: 1, lines: 29 }
                meta: { requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404':
          description: Survey response not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/survey/reports/questions:
    get:
