      summary: Get one Sick Leave request and its attachment metadata
      description: >-
        Requires the configured Sick Leave resource's VIEW action. Non-HR visibility is limited
        to the authenticated employee or request creator. Reading the day-type fields fails
        closed when the required Oracle columns cannot be verified.
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: headerId,
            in: path,
            required: true,
            schema: { $ref: '#/components/schemas/SickLeaveId' },
          }
      responses:
        '200':
          description: Sick Leave request detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SickLeaveDetailResponse' }
