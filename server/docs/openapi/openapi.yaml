  /api/v1/users:
    get:
      operationId: listUsers
      tags: [User Administration]
      summary: List application accounts
      description: >-
        Accounts joined to the employee master, paginated, with search, filters and
        an allowlisted sort. Requires `SECURITY_ADMINISTRATION.USER_ACCOUNTS:VIEW`
        (re-evaluated in Oracle on every request; MFA-verified session required).
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: search
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 100
            description: Case-insensitive contains-match on employee number, username or full name.
        - name: status
          in: query
          schema:
            enum: [PENDING, ACTIVE, DISABLED]
        - name: mfaEnrolled
          in: query
          schema:
            type: boolean
        - name: locked
          in: query
          schema:
            type: boolean
            description: Temporarily locked (LOCKED_UNTIL in the future).
        - name: sortBy
          in: query
          schema:
            enum: [employeeNumber, username, createdAt, lastLoginAt]
            default: employeeNumber
        - name: sortOrder
          in: query
          schema:
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Success.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: provisionUser
      tags: [User Administration]
      summary: Provision an account
      description: >-
        Creates a PENDING account without a password for an eligible employee
        (CURRENT_EMP_FLAG = Y, no termination on or before today in Asia/Riyadh,
        single employee-master row, present and unambiguous USER_NAME). No password
        is generated and nothing is granted. Audited as ACCOUNT_PROVISIONED in the
        same transaction. Requires `SECURITY_ADMINISTRATION.USER_ACCOUNTS:CREATE`
        (re-evaluated in Oracle on every request; MFA-verified session required).
        Requires the `X-CSRF-Token` header.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionRequest'
          multipart/form-data:
            schema:
              type: object
              required: [employeeNumber]
              properties:
                employeeNumber:
                  type: string
                  maxLength: 30
                  pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
                profileImage:
                  type: string
                  format: binary
      responses:
        '201':
          description: Created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/UserConflict'
        '500':
