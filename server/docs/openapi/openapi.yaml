  /api/v1/hr/sick-leave:
    get:
      operationId: listSickLeaveRequests
      tags: [HR Sick Leave]
      summary: List Sick Leave requests with filters and pagination
      description: >-
        Requires the configured Sick Leave resource's VIEW action. By default, results are
        limited to requests for the authenticated employee or created by that user. A verified
        HR visibility permission can expand the scope; `mine=true` restricts results to the
        authenticated employee or their created requests. The response data object contains
        `items`, `page`, `pageSize` and `total`. `totalLeaveDays` is populated for HR-visible
        users and null otherwise.
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: status,
            in: query,
            schema:
              { type: string, enum: [DRAFT, INPROCESS, APPROVED, REJECTED, ALL], default: ALL },
          }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: empId, in: query, schema: { type: string, maxLength: 40 } }
        - { name: empName, in: query, schema: { type: string, maxLength: 200 } }
        - { name: mine, in: query, schema: { type: boolean, default: false } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        '200':
          description: Matching requests and total-count pagination data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SickLeaveListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createSickLeaveRequest
      tags: [HR Sick Leave]
      summary: Create a Sick Leave request with required attachments
      description: >-
        Requires the configured Sick Leave resource's CREATE action and a session-bound CSRF
        token. The employee must be the authenticated employee or an eligible direct report.
        Leave type must exist in the configured lookup. The server calculates the inclusive
        leave duration from the dates and day types; a one-day request must use the same day
        type at both ends. At least one allowed attachment is required (up to 10 files, each
        at most 10 MiB). Creation fails closed if required Oracle schema capabilities or the
        configured leave-type lookup cannot be verified. No RBAC key or lookup code is implied
        by this contract.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SickLeaveCreateMultipart' }
      responses:
        '201':
          description: Sick Leave request and its attachment metadata were created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SickLeaveCreateResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404':
          description: The request is missing or is outside the caller's record scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: >-
            The required Oracle schema capabilities could not be verified; the write fails
            closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/hr/sick-leave/lookups/employees:
