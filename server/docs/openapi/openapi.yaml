  /api/v1/hr/requisitions:
    get:
      operationId: listRequisitions
      tags: [HR Requisitions]
      summary: List requisitions
      description: >-
        Personal Requisition Form records (XXZPI_PER_REQUISITIONS_ALL), paginated,
        with filters and an allowlisted sort. Row scoping is decided server-side
        (README Â§7.4): HR users (XX_DIGI_LOOKUP_VALUES LOOKUP_TYPE 'XXZP_HR') see
        every record and may narrow by createdBy; other users see their own rows plus
        those of recursively supervised employees (the XX_DIGI_EMP_MASTER
        SUPERVISOR_NAME chain), whatever they pass in the query. `ticketStatus`
        matches ATTRIBUTE1 with NULL treated as 'Open' (NVL). Requires
        `HR.REQUISITIONS:VIEW` (re-evaluated in Oracle on every request).
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: requisitionStatus
          in: query
          schema:
            enum: [Draft, Inprocess, Approved, Rejected]
        - name: ticketStatus
          in: query
          schema:
            enum: [Open, Accepted, Close, 'On Hold', Cancelled]
        - name: requisitionId
          in: query
          description: Exact REQUISITION_ID match.
          schema:
            $ref: '#/components/schemas/Id'
        - name: requesterName
          in: query
          description: Case-insensitive contains-match on REQUESTER_NAME.
          schema:
            type: string
            maxLength: 100
        - name: jobName
          in: query
          description: Case-insensitive contains-match on JOB_NAME.
          schema:
            type: string
            maxLength: 100
        - name: deptName
          in: query
          description: Case-insensitive contains-match on DEPT_NAME.
          schema:
            type: string
            maxLength: 100
        - name: reasonOfReq
          in: query
          schema:
            enum: [Replacement, Addition]
        - name: dateFrom
          in: query
          description: Request-date lower bound, inclusive (calendar date).
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: Request-date upper bound, same-day inclusive (calendar date).
          schema:
            type: string
            format: date
        - name: search
          in: query
          description: >-
            Case-insensitive contains-match across requester name, job name,
            department name and requisition number.
          schema:
            type: string
            maxLength: 100
        - name: createdBy
          in: query
          description: >-
            NUMBER(19,0) creator as a decimal string. HR callers only; ignored for
            non-HR callers (the server-side scope wins).
          schema:
            type: string
            pattern: '^[1-9][0-9]{0,18}$'
        - name: sortBy
          in: query
          schema:
            enum: [requisitionId, requestDate, dateNeeded, requesterName, creationDate]
            default: requisitionId
        - name: sortDir
          in: query
          schema:
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: >-
            Success. `ticketStatus` is NVL(ATTRIBUTE1, 'Open'); `acceptedDate` /
            `closedDate` are the raw ATTRIBUTE14 / ATTRIBUTE15 legacy dates (or null).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRequisitions'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createRequisition
      tags: [HR Requisitions]
      summary: Insert a requisition
      description: >-
        Inserts the header in ONE transaction. REQUISITION_ID comes from the
        Oracle identity column (INSERT â€¦ RETURNING, no MAX-based key; IDs step by 1)
        and REQUISITION_NUMBER is set to the same value in the same transaction
        (README Â§3.1). Attachment HEADER_IDs also come from the identity column. REQUISITION_STATUS is written 'Draft' only and
        no workflow row is created (README Â§11). REQUESTED_BY / REQUESTER_NAME are
        server-set from the employee master of the session user and rejected when
        taken from the body. Business dates travel as 'YYYY-MM-DD' and are stored as
        'DD-Mon-YY'. Multipart requests may carry attachment file parts (`files`,
        max 10 files, 10 MB each, Â§9 extension allowlist): the attachment rows and
        the physical files are written in the same transaction and compensated on
        failure. Recruitment status is server-owned and Open on every insert; ticketStatus is rejected in form payloads. Requires `HR.REQUISITIONS:CREATE` and the
        `X-CSRF-Token` header.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisitionWrite'
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/RequisitionWrite'
                - type: object
                  properties:
                    files:
                      type: array
                      maxItems: 10
                      items:
                        type: string
                        format: binary
      responses:
        '201':
          description: Created; `requisitionNumber` equals the string `requisitionId`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RequisitionCreated'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
