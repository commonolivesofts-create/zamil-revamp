            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [requisitionId, attachmentId, deleted]
                        properties:
                          requisitionId:
                            $ref: '#/components/schemas/Id'
                          attachmentId:
                            $ref: '#/components/schemas/Id'
                          deleted:
                            const: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/recovery/request:
    post:
      operationId: requestRecovery
      tags: [Authentication Recovery]
      summary: Request a password reset or MFA recovery link
      description: >-
        Anonymous self-service request. Always 202 with the same body for every
        username (no enumeration); the account lookup, token and e-mail are processed
        after the response, so its timing does not depend on the account. PASSWORD_RESET: ordinary employees and the Super
        Administrator; MFA_RECOVERY: the Super Administrator only (pinned address).
        Other privileged accounts are recovered by the Super Administrator. 503
        DELIVERY_UNAVAILABLE for every request while no delivery channel is
        configured. Rate limited per client; one link per account and type per 5
        minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
      responses:
        '202':
          description: Accepted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RecoveryAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DeliveryUnavailable'
  /api/v1/auth/password/setup:
    post:
      operationId: completePasswordSetup
      tags: [Authentication Recovery]
      summary: Set the first password (PENDING account)
      description: >-
        Consumes a PASSWORD_SETUP token (24 h, single use), applies the password
        policy, sets the Argon2id hash and PASSWORD_CHANGED_AT and activates the
        account if the employee is still eligible. Audited as PASSWORD_CHANGED /
        PASSWORD_SETUP and ACCOUNT_ACTIVATED. Sign in afterwards.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordTokenRequest'
      responses:
        '200':
          description: Success.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PasswordChangeResult'
        '400':
          $ref: '#/components/responses/RecoveryError'
        '403':
          $ref: '#/components/responses/RecoveryRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/password/reset:
    post:
      operationId: completePasswordReset
      tags: [Authentication Recovery]
      summary: Reset the password with a reset link
      description: >-
        Consumes a PASSWORD_RESET token (30 min, single use). The new password must
        satisfy the policy and differ from the current one. Clears the lockout,
        revokes every session and outstanding reset token. MFA remains required at
        the next sign-in. Audited as PASSWORD_CHANGED / PASSWORD_RESET.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordTokenRequest'
      responses:
        '200':
          description: Success.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PasswordChangeResult'
        '400':
          $ref: '#/components/responses/RecoveryError'
        '403':
          $ref: '#/components/responses/RecoveryRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/password/change:
    post:
      operationId: changePassword
      tags: [Authentication Recovery]
      summary: Change the password (signed in)
      description: >-
        Requires the current password (wrong values count toward the 5-failure
        lockout) and the X-CSRF-Token header. Revokes every session including the
        current one and clears the session cookie. Audited as PASSWORD_CHANGED /
        PASSWORD_CHANGE.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '200':
          description: Success.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PasswordChangeResult'
        '400':
          $ref: '#/components/responses/RecoveryError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RecoveryRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/mfa/recovery/start:
    post:
      operationId: startMfaRecovery
      tags: [Authentication Recovery]
      summary: Start MFA recovery
      description: >-
        MFA_RECOVERY token (15 min) plus the current password; returns the setup key
        of a NEW authenticator (shown once). Nothing is stored and the existing
        authenticator stays valid until confirmation. Wrong passwords count toward
        the lockout.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaRecoveryStartRequest'
      responses:
        '200':
          description: Success.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MfaEnrollment'
        '400':
          $ref: '#/components/responses/RecoveryError'
        '401':
          $ref: '#/components/responses/RecoveryRefused'
        '403':
          $ref: '#/components/responses/RecoveryRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/mfa/recovery/confirm:
    post:
      operationId: confirmMfaRecovery
      tags: [Authentication Recovery]
      summary: Confirm MFA recovery
      description: >-
        Token, current password and a code from the new authenticator. Consumes the
        token, replaces the stored secret (only if unchanged), revokes every session
        and clears the session cookie. The account is never left without MFA.
        Audited as MFA_RECOVERED.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaRecoveryConfirmRequest'
      responses:
        '200':
          description: Success.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MfaRecoveryResult'
        '400':
          $ref: '#/components/responses/RecoveryError'
        '401':
          $ref: '#/components/responses/RecoveryRefused'
        '403':
          $ref: '#/components/responses/RecoveryRefused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/users/{userId}/password-setup:
    post:
      operationId: issuePasswordSetup
      tags: [User Administration]
      summary: Send a password-setup link
      description: >-
        For a PENDING account without a password and an eligible employee. Requires
        `SECURITY_ADMINISTRATION.USER_ACCOUNTS:CREATE`, the X-CSRF-Token header and
        the target employee number as explicit confirmation. Privileged accounts:
        Super Administrator only, MFA verified within 5 minutes. The token is sent
        only to the delivery channel and never returned. 503 DELIVERY_UNAVAILABLE
        (NO_CHANNEL_CONFIGURED / RECIPIENT_UNAVAILABLE / DELIVERY_FAILED) until
        delivery is configured. Audited as ACTION_TOKEN_ISSUED.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSetupIssueRequest'
      responses:
        '202':
          description: Accepted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenIssued'
        '400':
          $ref: '#/components/responses/RecoveryError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RecoveryNotApplicable'
        '429':
          $ref: '#/components/responses/RecoveryThrottled'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DeliveryUnavailable'
  /api/v1/users/{userId}/recovery:
    post:
      operationId: issueRecovery
      tags: [User Administration]
      summary: Send a password-reset or MFA-recovery link
      description: >-
        Administrator-assisted recovery (docs/07 §5). Requires
        `SECURITY_ADMINISTRATION.ACCOUNT_RECOVERY:ISSUE`, the X-CSRF-Token header
        and explicit confirmation. Ordinary employees: any holder of the permission.
        Main Administrators, Administrators and other security-permission holders:
        only the Super Administrator with MFA verified within 5 minutes (direct
        authorization, no approval queue). Never for the Super Administrator account
        (self-recovery only) or the actor. Audited as ACTION_TOKEN_ISSUED.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryIssueRequest'
      responses:
        '202':
          description: Accepted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenIssued'
        '400':
          $ref: '#/components/responses/RecoveryError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RecoveryNotApplicable'
        '429':
          $ref: '#/components/responses/RecoveryThrottled'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DeliveryUnavailable'
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Liveness probe
      description: >-
        Confirms that the API process is running and able to respond. Does not
        check Oracle or any other dependency. No authentication required.
      responses:
        '200':
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Liveness'
              example:
                success: true
                data:
                  status: UP
                meta:
                  requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '500':
          $ref: '#/components/responses/InternalError'
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Readiness probe
      description: >-
        Confirms that the instance can serve work: both Oracle connection pools
        (LOW and HIGH) must complete a bounded, read-only check. Results are reused
        for a short period and concurrent requests share one check, so frequent
        probes cannot exhaust the pools. No authentication required. Database
        identities, hosts and driver errors are never returned.
      responses:
        '200':
          description: The instance is ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Readiness'
              example:
                success: true
                data:
                  status: READY
                  database:
                    LOW: UP
                    HIGH: UP
                meta:
                  requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '503':
          description: A required database pool is unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: SERVICE_UNAVAILABLE
                  message: The service is not ready
                  details:
                    - field: database.HIGH
                      message: Database pool is unavailable
                meta:
                  requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-zr_session
      description: >-
        Opaque session token set by `POST /api/v1/auth/login` (HttpOnly; the
        browser sends it automatically). The cookie name is deployment
        configurable. This scheme describes authentication only; it does not
        imply any business permission.
    mfaChallengeCookie:
      type: apiKey
      in: cookie
      name: __Host-zr_mfa
      description: >-
        Opaque MFA challenge token set by `POST /api/v1/auth/login` after a correct
        password when MFA is required. Valid for 5 minutes, single use, accepted
        only by the `/api/v1/auth/mfa/*` endpoints and never as a session.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF token from the login response or `GET /api/v1/auth/csrf`.
      schema:
        type: string
    MfaCsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Challenge-bound CSRF token from the login response that issued the challenge.
      schema:
        type: string
    RoleId:
      name: roleId
      in: path
      required: true
      description: NUMBER(19,0) identifier as a decimal string.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,18}$'
    UserId:
      name: userId
      in: path
      required: true
      description: NUMBER(19,0) identifier as a decimal string.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,18}$'
    ModuleId:
      name: moduleId
      in: path
      required: true
      description: NUMBER(19,0) identifier as a decimal string.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,18}$'
    ResourceId:
      name: resourceId
      in: path
      required: true
      description: NUMBER(19,0) identifier as a decimal string.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,18}$'
    PermissionId:
      name: permissionId
      in: path
      required: true
      description: NUMBER(19,0) identifier as a decimal string.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,18}$'
    SessionId:
      name: sessionId
      in: path
      required: true
      description: NUMBER(19,0) identifier as a decimal string.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,18}$'
    HeaderId:
      name: headerId
      in: path
      required: true
      description: NUMBER(19,0) header identifier of the interview assessment, as a decimal string.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,18}$'
    RequisitionId:
      name: requisitionId
      in: path
      required: true
      description: NUMBER(19,0) REQUISITION_ID of the personal requisition, as a decimal string.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,18}$'
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      description: NUMBER(19,0) HEADER_ID of the xxzp_all_attachments row, as a decimal string.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,18}$'
  headers:
    RequestId:
      description: >-
        Request correlation ID. A valid incoming X-Request-Id (8–64 characters of
        A–Z, a–z, 0–9, '.', '_' or '-') is reused; otherwise a UUID is generated.
      schema:
        type: string
  schemas:
    PasswordPolicy:
      type: object
      required:
        - minLength
        - maxLength
        - requireUppercase
        - requireLowercase
        - requireDigit
        - requireSpecialCharacter
        - expiryDays
        - expiryReminderDays
      properties:
        minLength:
          type: integer
          description: Minimum length in Unicode code points.
        maxLength:
          type: integer
        requireUppercase:
          type: boolean
        requireLowercase:
          type: boolean
        requireDigit:
          type: boolean
        requireSpecialCharacter:
          type: boolean
          description: Any character that is not a letter or digit, including a space.
        expiryDays:
          type: integer
          description: Password age at which a new login is refused.
        expiryReminderDays:
          type: array
          items:
            type: integer
          description: Days before expiry at which reminders are sent (reminders are not yet implemented).
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
          description: Employee-master USER_NAME; matched case-insensitively after trimming.
        password:
          type: string
          minLength: 1
          maxLength: 256
          format: password
          description: Verified exactly as typed (not trimmed).
    AuthUser:
      type: object
      required: [id, username, employeeNumber, fullName, email, jobTitle, department]
      properties:
        id:
          type: string
          description: Local account ID (NUMBER(19,0), transported as a string to preserve precision).
          examples: ['105']
        username:
          type: [string, 'null']
        employeeNumber:
          type: string
        fullName:
          type: [string, 'null']
        email:
          type: [string, 'null']
        jobTitle:
          type: [string, 'null']
        department:
          type: [string, 'null']
    SessionInfo:
      type: object
      required: [expiresAt, idleTimeoutSeconds, mfaVerified]
      properties:
        expiresAt:
          type: string
          format: date-time
          description: Absolute session expiry (UTC).
        idleTimeoutSeconds:
          type: integer
          description: Inactivity period after which the session ends (accurate to about one minute).
        mfaVerified:
          type: boolean
    PasswordState:
      type: object
      required: [expired, expiresAt]
      properties:
        expired:
          type: boolean
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: When the password reaches 90 days (UTC); null if its change time is unknown.
    CsrfToken:
      type: object
      required: [token, headerName]
      properties:
        token:
          type: string
        headerName:
          type: string
          const: X-CSRF-Token
    MfaChallenge:
      type: object
      required: [authenticated, mfa, csrf]
      properties:
        authenticated:
          const: false
        mfa:
          type: object
          required: [required, enrollmentRequired, expiresAt]
          properties:
            required:
              const: true
            enrollmentRequired:
              type: boolean
              description: True when no authenticator is set up yet (use the enrollment endpoints).
            expiresAt:
              type: string
              format: date-time
              description: Challenge expiry (UTC), 5 minutes after the password was verified.
        csrf:
          $ref: '#/components/schemas/CsrfToken'
    MfaEnrollment:
      type: object
      required:
        [secret, otpauthUri, issuer, accountName, algorithm, digits, periodSeconds, expiresAt]
      properties:
        secret:
          type: string
          description: >-
            Base32 TOTP secret (160 bits). Show once; never store client-side or copy
            into chats, tickets or logs.
        otpauthUri:
          type: string
          description: >-
            Key URI for authenticator apps (render as a QR code). The label is
            `<issuer>:<accountName>`, each URL-encoded, joined by a literal colon.
        issuer:
          type: string
          description: Issuer shown by the authenticator app.
        accountName:
          type: string
          description: Account name shown by the authenticator app (the USER_NAME).
        algorithm:
          const: SHA1
        digits:
          const: 6
        periodSeconds:
          const: 30
        expiresAt:
          type: string
          format: date-time
          description: >-
            Confirm before this time: the challenge expiry (enrollment), or 5 minutes
            after MFA was verified on the session (replacement).
    MfaReplacementResult:
      type: object
      required: [replaced, sessionsRevoked, reauthenticationRequired]
      properties:
        replaced:
          const: true
        sessionsRevoked:
          type: integer
          description: Sessions and challenges of the user revoked, including the current session.
        reauthenticationRequired:
          const: true
    MfaCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^\d{6}$'
          description: The current 6-digit code from the authenticator app.
    LoginResult:
      type: object
      required: [authenticated, user, session, password, csrf]
      properties:
        authenticated:
          const: true
        user:
          $ref: '#/components/schemas/AuthUser'
        session:
          $ref: '#/components/schemas/SessionInfo'
        password:
          $ref: '#/components/schemas/PasswordState'
        csrf:
          $ref: '#/components/schemas/CsrfToken'
    CurrentUser:
      type: object
      required: [user, session, password]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        session:
          $ref: '#/components/schemas/SessionInfo'
        password:
          $ref: '#/components/schemas/PasswordState'
    Id:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
    Role:
      type: object
      required: [roleId, roleCode, roleName, isActive]
      properties:
        roleId:
          $ref: '#/components/schemas/Id'
        roleCode:
          type: string
        roleName:
          type: string
        description:
          type: [string, 'null']
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: [string, 'null']
          format: date-time
    RoleCreateRequest:
      type: object
      additionalProperties: false
      required: [roleCode, roleName]
      properties:
        roleCode:
          type: string
          maxLength: 60
          pattern: '^[A-Z][A-Z0-9_]*$'
        roleName:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 500
    RoleUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        roleName:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 500
    Pagination:
      type: object
      required: [page, limit, total, totalPages, hasNextPage, hasPreviousPage]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
    PaginatedRoles:
      type: object
      required: [success, data, pagination, meta]
      properties:
        success:
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        pagination:
          $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    CatalogModule:
      type: object
      properties:
        moduleId:
          $ref: '#/components/schemas/Id'
        moduleCode:
          type: string
        moduleName:
          type: string
        displayOrder:
          type: integer
        isActive:
          type: boolean
        resources:
          type: array
          items:
            type: object
            properties:
              resourceId:
                $ref: '#/components/schemas/Id'
              resourceCode:
                type: string
              resourceName:
                type: string
              isActive:
                type: boolean
              permissions:
                type: array
                items:
                  type: object
                  properties:
                    permissionId:
                      $ref: '#/components/schemas/Id'
                    actionCode:
                      type: string
                    description:
                      type: [string, 'null']
                    isActive:
                      type: boolean
    ModuleCreateRequest:
      type: object
      additionalProperties: false
      required: [moduleCode, moduleName]
      properties:
        moduleCode:
          type: string
          maxLength: 60
          pattern: '^[A-Z][A-Z0-9_]*$'
        moduleName:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 500
        displayOrder:
          type: integer
          minimum: 0
          maximum: 99999
    ResourceCreateRequest:
      type: object
      additionalProperties: false
      required: [resourceCode, resourceName]
      properties:
        resourceCode:
          type: string
          maxLength: 80
          pattern: '^[A-Z][A-Z0-9_]*$'
        resourceName:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 500
    PermissionCreateRequest:
      type: object
      additionalProperties: false
      required: [actionCode]
      properties:
        actionCode:
          type: string
          maxLength: 40
          pattern: '^[A-Z][A-Z0-9_]*$'
        description:
          type: [string, 'null']
          maxLength: 500
    ActivationRequest:
      type: object
      additionalProperties: false
      required: [isActive]
      properties:
        isActive:
          type: boolean
    PermissionKey:
      type: object
      required: [permissionId, moduleCode, resourceCode, actionCode]
      properties:
        permissionId:
          $ref: '#/components/schemas/Id'
        moduleCode:
          type: string
        resourceCode:
          type: string
        actionCode:
          type: string
    RolePermission:
      allOf:
        - $ref: '#/components/schemas/PermissionKey'
        - type: object
          properties:
            isActive:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: [string, 'null']
              format: date-time
    EffectivePermission:
      allOf:
        - $ref: '#/components/schemas/PermissionKey'
        - type: object
          properties:
            viaRole:
              type: boolean
            viaOverride:
              type: boolean
    MyPermissions:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        mfaVerified:
          type: boolean
          description: True only when this session completed an MFA verification.
        adminMfaRequired:
          type: boolean
          description: >-
            Whether SECURITY_ADMINISTRATION permissions require an MFA-verified session on
            this server. Always true except under the local-development exception
            (AUTH_ADMIN_MFA_REQUIRED=false, allowed only for NODE_ENV=development on a loopback
            listener). It never changes `mfaVerified`.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/EffectivePermission'
    UserRole:
      type: object
      properties:
        roleId:
          $ref: '#/components/schemas/Id'
        roleCode:
          type: string
        roleName:
          type: string
        roleActive:
          type: boolean
        isActive:
          type: boolean
        expiresAt:
          type: [string, 'null']
          format: date-time
        effective:
          type: boolean
          description: Active, unexpired membership of an active role.
    UserRoleAssignRequest:
      type: object
      additionalProperties: false
      properties:
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: ISO 8601 instant in the future; null or absent for no expiry.
    UserOverride:
      allOf:
        - $ref: '#/components/schemas/PermissionKey'
        - type: object
          properties:
            effect:
              enum: [ALLOW, DENY]
            justification:
              type: string
            isActive:
              type: boolean
            expiresAt:
              type: [string, 'null']
              format: date-time
    OverrideRequest:
      type: object
      additionalProperties: false
      required: [effect, justification]
      properties:
        effect:
          enum: [ALLOW, DENY]
        justification:
          type: string
          minLength: 1
          maxLength: 500
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: ISO 8601 instant in the future; null or absent for no expiry.
    ChangeResult:
      type: object
      description: >-
        Identifiers of the changed item and its resulting state. `changed` is false
        when the request was a no-op (already in the requested state).
      additionalProperties: true
    UserListItem:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        employeeNumber:
          type: string
        username:
          type: [string, 'null']
        fullName:
          type: [string, 'null']
        department:
          type: [string, 'null']
        jobTitle:
          type: [string, 'null']
        accountStatus:
          enum: [PENDING, ACTIVE, DISABLED]
        locked:
          type: boolean
        mfaEnrolled:
          type: boolean
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    PaginatedUsers:
      type: object
      required: [success, data, pagination, meta]
      properties:
        success:
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserListItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    EmployeeCandidate:
      type: object
      properties:
        employeeNumber:
          type: string
        username:
          type: [string, 'null']
        fullName:
          type: [string, 'null']
        department:
          type: [string, 'null']
        jobTitle:
          type: [string, 'null']
        currentEmployeeFlag:
          type: [string, 'null']
        terminationStatus:
          enum: [NONE, FUTURE, ENDED]
        userId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        accountStatus:
          type: [string, 'null']
        provisionable:
          type: boolean
        ineligibilityReason:
          description: >-
            EMPLOYEE_AMBIGUOUS, EMPLOYEE_NOT_CURRENT, EMPLOYEE_TERMINATED,
            USERNAME_MISSING or USERNAME_AMBIGUOUS; null when eligible.
          type: [string, 'null']
    PaginatedCandidates:
      type: object
      required: [success, data, pagination, meta]
      properties:
        success:
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeCandidate'
        pagination:
          $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ProvisionRequest:
      type: object
      additionalProperties: false
      required: [employeeNumber]
      properties:
        employeeNumber:
          type: string
          maxLength: 30
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'
          description: XX_DIGI_EMP_MASTER.EMPLOYEE_NUMBER.
    UserDetail:
      type: object
      description: >-
        Never contains PASSWORD_HASH, MFA secrets or token values. Change responses
        add `changed` (false for a no-op) and, for disable, `sessionsRevoked`.
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        employeeNumber:
          type: string
        account:
          type: object
          properties:
            status:
              enum: [PENDING, ACTIVE, DISABLED]
            locked:
              type: boolean
            lockedUntil:
              type: [string, 'null']
              format: date-time
            failedLoginAttempts:
              type: integer
            lastFailedLoginAt:
              type: [string, 'null']
              format: date-time
            lastLoginAt:
              type: [string, 'null']
              format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: [string, 'null']
              format: date-time
        password:
          type: object
          properties:
            set:
              type: boolean
            changedAt:
              type: [string, 'null']
              format: date-time
            expiresAt:
              type: [string, 'null']
              format: date-time
            expired:
              type: [boolean, 'null']
        mfa:
          type: object
          properties:
            enrolled:
              type: boolean
            enrolledAt:
              type: [string, 'null']
              format: date-time
        employee:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                username:
                  type: [string, 'null']
                fullName:
                  type: [string, 'null']
                email:
                  type: [string, 'null']
                jobTitle:
                  type: [string, 'null']
                department:
                  type: [string, 'null']
                currentEmployeeFlag:
                  type: [string, 'null']
                terminationStatus:
                  enum: [NONE, FUTURE, ENDED]
        eligibility:
          type: object
          properties:
            eligible:
              type: boolean
            reason:
              type: [string, 'null']
        classification:
          type: object
          properties:
            protectedSuperAdministrator:
              type: boolean
            privilegedRoleMember:
              type: boolean
            securityAdministration:
              type: boolean
            mfaRequired:
              type: boolean
        activation:
          type: object
          properties:
            ready:
              type: boolean
            unmetPrerequisites:
              type: array
              items:
                type: string
              description: Employee eligibility reasons and/or PASSWORD_NOT_SET.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
        activeSessions:
          type: array
          items:
            type: object
            properties:
              sessionId:
                $ref: '#/components/schemas/Id'
              createdAt:
                type: string
                format: date-time
              lastActivityAt:
                type: string
                format: date-time
              expiresAt:
                type: string
                format: date-time
              mfaVerified:
                type: boolean
              ipAddress:
                type: [string, 'null']
              userAgent:
                type: [string, 'null']
    SessionRevocation:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        sessionId:
          $ref: '#/components/schemas/Id'
        sessionsRevoked:
          type: integer
        revoked:
          type: boolean
        changed:
          type: boolean
    RecoveryRequest:
      type: object
      additionalProperties: false
      required: [username, purpose]
      properties:
        username:
          type: string
          maxLength: 100
        purpose:
          enum: [PASSWORD_RESET, MFA_RECOVERY]
    RecoveryAccepted:
      type: object
      properties:
        accepted:
          const: true
        message:
          type: string
    PasswordTokenRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Single-use token from the delivered link (request body only, never a URL).
        newPassword:
          type: string
          minLength: 1
          maxLength: 256
          description: Must satisfy GET /api/v1/auth/password/policy.
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
        newPassword:
          type: string
          minLength: 1
          maxLength: 256
    PasswordChangeResult:
      type: object
      properties:
        passwordChanged:
          const: true
        accountStatus:
          const: ACTIVE
        sessionsRevoked:
          type: integer
        signInRequired:
          const: true
    MfaRecoveryStartRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Single-use token from the delivered link (request body only, never a URL).
        password:
          type: string
          minLength: 1
          maxLength: 256
    MfaRecoveryConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, password, code]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Single-use token from the delivered link (request body only, never a URL).
        password:
          type: string
          minLength: 1
          maxLength: 256
        code:
          type: string
          pattern: '^[0-9]{6}$'
    MfaRecoveryResult:
      type: object
      properties:
        mfaRecovered:
          const: true
        sessionsRevoked:
          type: integer
        signInRequired:
          const: true
    PasswordSetupIssueRequest:
      type: object
      additionalProperties: false
      required: [confirmEmployeeNumber]
      properties:
        confirmEmployeeNumber:
          type: string
          maxLength: 30
          description: The employee number of the target account, re-entered as explicit authorization.
    RecoveryIssueRequest:
      type: object
      additionalProperties: false
      required: [purpose, confirmEmployeeNumber]
      properties:
        purpose:
          enum: [PASSWORD_RESET, MFA_RECOVERY]
        confirmEmployeeNumber:
          type: string
          maxLength: 30
          description: The employee number of the target account, re-entered as explicit authorization.
    TokenIssued:
      type: object
      description: Never contains the token.
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        actionType:
          enum: [PASSWORD_SETUP, PASSWORD_RESET, MFA_RECOVERY]
        expiresAt:
          type: string
          format: date-time
        delivered:
          const: true
        authorizedBySuperAdministrator:
          type: boolean
    ResponseMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          description: Correlation ID, identical to the X-Request-Id response header.
    InterviewAssessmentRating:
      type: string
      description: >-
        Section rating '1'–'5' or 'N/A' (README §1.2). An absent rating is stored
        and returned as '-'.
      enum: ['1', '2', '3', '4', '5', 'N/A', '']
    InterviewAssessmentPersonalSpec:
      type: object
      additionalProperties: false
      properties:
        rate1: { $ref: '#/components/schemas/InterviewAssessmentRating' }
        remark1: { type: string, maxLength: 500 }
        rate2: { $ref: '#/components/schemas/InterviewAssessmentRating' }
        remark2: { type: string, maxLength: 500 }
        rate3: { $ref: '#/components/schemas/InterviewAssessmentRating' }
        remark3: { type: string, maxLength: 500 }
        rate4: { $ref: '#/components/schemas/InterviewAssessmentRating' }
        remark4: { type: string, maxLength: 500 }
        rate5: { $ref: '#/components/schemas/InterviewAssessmentRating' }
        remark5: { type: string, maxLength: 500 }
        rate6: { $ref: '#/components/schemas/InterviewAssessmentRating' }
        remark6: { type: string, maxLength: 500 }
        rate7: { $ref: '#/components/schemas/InterviewAssessmentRating' }
        remark7: { type: string, maxLength: 500 }
        rate8: { $ref: '#/components/schemas/InterviewAssessmentRating' }
        remark8: { type: string, maxLength: 500 }
        rate9:
          type: integer
          minimum: 0
          description: Accepted on write but always recomputed server-side as the sum of rate1..rate8.
        remarks: { type: string, maxLength: 500 }
    InterviewAssessmentJobCompetency:
      type: object
      additionalProperties: false
      properties:
        cRating1: { $ref: '#/components/schemas/InterviewAssessmentRating' }
        cRemark1: { type: string, maxLength: 500 }
        cRating2: { $ref: '#/components/schemas/InterviewAssessmentRating' }
        cRemark2: { type: string, maxLength: 500 }
        cRating3: { $ref: '#/components/schemas/InterviewAssessmentRating' }
        cRemark3: { type: string, maxLength: 500 }
        cRating4: { $ref: '#/components/schemas/InterviewAssessmentRating' }
        cRemark4: { type: string, maxLength: 500 }
        cRating5: { $ref: '#/components/schemas/InterviewAssessmentRating' }
        cRemark5: { type: string, maxLength: 500 }
        cRating6: { $ref: '#/components/schemas/InterviewAssessmentRating' }
        cRemark6: { type: string, maxLength: 500 }
        cRating7:
          type: integer
          minimum: 0
          description: >-
            Accepted on write but always recomputed server-side as the sum of
            cRating1..cRating6.
        cRemarks: { type: string, maxLength: 500 }
        sumStrength: { type: string, maxLength: 4000 }
        sumWeekness:
          type: string
          maxLength: 4000
          description: Legacy column spelling (WEAKNESSES_SUMMARY) kept until a DB migration.
    InterviewAssessmentEvaluation:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          enum: [Passed, Hold, Failed]
          description: Stored in XXZP_INTERVIEW_EVAL_T.STATUS (EVAL_STATUS).
        interviewedBy: { type: string, maxLength: 200 }
        adminManager: { type: string, maxLength: 200 }
        hrRep: { type: string, maxLength: 200 }
        deptRep: { type: string, maxLength: 200 }
        comment: { type: string, maxLength: 500 }
        managningDirector:
          type: string
          maxLength: 200
          description: Legacy column spelling (MANAGNING_DIRECTOR) kept until a DB migration.
    InterviewAssessmentWrite:
      type: object
      additionalProperties: false
      required: [candidateName, requisitionNo, positionName, attribute3, evaluation]
      properties:
        candidateName: { type: string, maxLength: 200 }
        requisitionNo:
          type: string
          maxLength: 100
          description: Must be an approved requisition (see the requisitions lookup).
        positionName: { type: string, maxLength: 200 }
        attribute3:
          enum: ['300000003618177', '300000003618190']
          description: APP_BU_INFO payroll business unit (README §1.1); also prefixes INT_NO.
        nationality: { type: string, maxLength: 100 }
        materialStatus:
          enum: [Single, Married, '']
          description: Legacy column spelling of MARITAL_STATUS (README §10.8).
        age: { type: integer, minimum: 0 }
        interviewDate:
          type: string
          format: date
          description: Calendar date 'YYYY-MM-DD'; stored as 'DD-Mon-YY'.
        interviewTime: { type: string, maxLength: 20 }
        interviewType: { enum: [Personal, Online, ''] }
        secondaryEducation:
          enum: [Secondary Education, Diploma, Degree, 'Masters Degree', '']
        secondaryEducationChk: { enum: [Yes, No, ''] }
        lastPositionHeld: { type: string, maxLength: 200 }
        companyName: { type: string, maxLength: 200 }
        relevantYearsExperience: { type: integer, minimum: 0 }
        location: { type: string, maxLength: 100 }
        currentEmployer: { type: string, maxLength: 200 }
        joining:
          type: string
          format: date
          description: Intended-joining calendar date 'YYYY-MM-DD'; stored as 'DD-Mon-YY'.
        major: { type: string, maxLength: 100 }
        division: { enum: [Food, Non-Food, ''] }
        curSalBasic: { type: number, minimum: 0 }
        expSalBasic: { type: number, minimum: 0 }
        curSalTotal: { type: number, minimum: 0 }
        expSalTotal: { type: number, minimum: 0 }
        interviewedBy: { type: string, maxLength: 200 }
        interviewedBy2: { type: string, maxLength: 200 }
        interviewedBy3: { type: string, maxLength: 200 }
        status:
          enum: [Incomplete]
          description: >-
            Plain data column: only ever written 'Incomplete' on insert and never
            updated. The field is accepted for compatibility and no other value passes.
        personalSpec: { $ref: '#/components/schemas/InterviewAssessmentPersonalSpec' }
        jobCompetency: { $ref: '#/components/schemas/InterviewAssessmentJobCompetency' }
        evaluation: { $ref: '#/components/schemas/InterviewAssessmentEvaluation' }
    InterviewAssessmentCreated:
      type: object
      required: [headerId, intNo, uuid]
      properties:
        headerId:
          $ref: '#/components/schemas/Id'
        intNo:
          type: string
          description: ATTRIBUTE3 + '-' + the zero-padded headerId.
        uuid:
          type: string
          format: uuid
    InterviewAssessmentDetail:
      type: object
      required: [headerId, candidateName, positionName, requisitionNo, attribute3, status, intNo]
      properties:
        headerId: { $ref: '#/components/schemas/Id' }
        candidateName: { type: string }
        positionName: { type: string }
        requisitionNo: { type: string }
        attribute3: { type: string }
        nationality: { type: string }
        materialStatus: { type: string }
        age: { type: integer }
        interviewDate:
          type: string
          description: Stored legacy 'DD-Mon-YY' form, as returned by the read.
        interviewTime: { type: string }
        interviewType: { type: string }
        secondaryEducation: { type: string }
        secondaryEducationChk: { type: string }
        lastPositionHeld: { type: string }
        companyName: { type: string }
        relevantYearsExperience: { type: integer }
        location: { type: string }
        currentEmployer: { type: string }
        joining: { type: string, description: Stored legacy 'DD-Mon-YY' form. }
        major: { type: string }
        division: { type: string }
        curSalBasic: { type: [number, 'null'] }
        expSalBasic: { type: [number, 'null'] }
        curSalTotal: { type: [number, 'null'] }
        expSalTotal: { type: [number, 'null'] }
        interviewedBy: { type: string }
        interviewedBy2: { type: string }
        interviewedBy3: { type: string }
        status: { enum: [Incomplete] }
        intNo: { type: string }
        approvalAuthority:
          type: [string, 'null']
          description: XX_DIGI_JOB_MASTER.APPROVAL_AUTHORITY of the position; null when absent.
        personalSpecTotal: { type: integer }
        personalSpecResult: { type: string }
        jobCompetencyTotal: { type: integer }
        jobCompetencyResult: { type: string }
        personalSpec:
          oneOf:
            - $ref: '#/components/schemas/InterviewAssessmentPersonalSpec'
            - type: 'null'
          description: >-
            Null when the XXZP_PERSONAL_SPEC_T row is missing. rate9/remarks carry
            the header totals on read.
        jobCompetency:
          oneOf:
            - $ref: '#/components/schemas/InterviewAssessmentJobCompetency'
            - type: 'null'
          description: Null when the XXZP_JOB_COMPETENCY_T row is missing; cRating7/cRemarks carry the totals.
        evaluation:
          oneOf:
            - $ref: '#/components/schemas/InterviewAssessmentEvaluation'
            - type: 'null'
          description: Null when the XXZP_INTERVIEW_EVAL_T row is missing.
        createdAt: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'] }
    InterviewAssessmentListItem:
      type: object
      required:
        [
          headerId,
          intNo,
          candidateName,
          positionName,
          interviewDate,
          headerStatus,
          statusLabel,
          evaluationStatus,
          creationDate,
          createdBy,
        ]
      properties:
        headerId: { $ref: '#/components/schemas/Id' }
        intNo: { type: string }
        candidateName: { type: string }
        positionName: { type: string }
        nationality: { type: string }
        interviewDate:
          type: string
          description: Stored legacy 'DD-Mon-YY' form, as returned by the listing.
        requisitionNo: { type: string }
        division: { type: string }
        interviewType: { type: string }
        createdBy: { $ref: '#/components/schemas/Id' }
        creationDate: { type: string, format: date }
        headerStatus: { enum: [Incomplete, Inprocess, Approved, Rejected] }
        statusLabel:
          enum: [Draft, InProcess, Approved, Rejected]
          description: >-
            Legacy display mapping (README §7.3): Inprocess becomes InProcess;
            everything else outside Approved/Rejected is Draft.
        evaluationStatus:
          type: [string, 'null']
          description: Only populated when headerStatus is Approved; null otherwise (README §7.3).
    PaginatedInterviewAssessments:
      type: object
      required: [success, data, pagination, meta]
      properties:
        success:
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/InterviewAssessmentListItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ApprovedRequisition:
      type: object
      required: [requisitionNumber, jobName]
      properties:
        requisitionNumber: { type: string }
        jobName: { type: string }
    SuccessResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          const: true
        data:
          description: Endpoint-specific payload.
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ErrorResponse:
      type: object
      required: [success, error, meta]
      properties:
        success:
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable error code for client-side handling.
              examples: [VALIDATION_ERROR, RESOURCE_NOT_FOUND, INTERNAL_ERROR]
            message:
              type: string
              description: Safe, user-displayable message.
            details:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    Liveness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: UP
    Readiness:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          const: READY
        database:
          type: object
          required: [LOW, HIGH]
          properties:
            LOW:
              type: string
              const: UP
            HIGH:
              type: string
              const: UP
    EmploymentOfferLine:
      type: object
      additionalProperties: false
      required: [approximateStartingDate]
      description: >-
        Single line object (README §3.2) — one line per header, never an array.
        Absent optional values bind NULL and the SQL applies its NVL defaults.
      properties:
        basicSalary:
          description: >-
            BASIC_SALARY ≥ 0. A comma string ("8,500") is accepted and stripped to
            a number server-side; stored as 0 when absent.
          oneOf:
            - type: number
              minimum: 0
            - type: string
              pattern: '^(\d{1,3}(,\d{3})+|\d+)(\.\d+)?$'
        basicSalaryAr: { type: string, maxLength: 1000 }
        housingAllowance: { type: string, maxLength: 500 }
        housingAllowanceAr: { type: string, maxLength: 500 }
        transportation: { type: string, maxLength: 500 }
        transportationAr: { type: string, maxLength: 500 }
        annualVacation: { type: string, maxLength: 500 }
        annualVacationAr: { type: string, maxLength: 500 }
        ticket: { type: string, maxLength: 500 }
        ticketAr: { type: string, maxLength: 500 }
        medical: { type: string, maxLength: 500 }
        medicalAr: { type: string, maxLength: 500 }
        contractPeriod: { type: string, maxLength: 500 }
        contractPeriodAr: { type: string, maxLength: 500 }
        approximateStartingDate:
          type: string
          format: date
          description: Required; stored as 'DD-Mon-YYYY'.
