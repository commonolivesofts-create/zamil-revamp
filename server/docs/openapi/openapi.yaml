          required: [empNo]
          properties:
            empNo: { type: integer, minimum: 1 }
          additionalProperties: true
          description: Only empNo is used; employee details are loaded from the employee master.
        contact: { type: string, minLength: 1, maxLength: 100 }
        purpose: { type: string, minLength: 1, maxLength: 1000 }
        vacationFrom: { $ref: '#/components/schemas/EmployeeClearanceNullableDate' }
        vacationTo: { $ref: '#/components/schemas/EmployeeClearanceNullableDate' }
        departmentManager:
          type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 500 }
            empNo:
              description: Accepted but stripped; manager employee number is resolved server-side.
            date: { $ref: '#/components/schemas/EmployeeClearanceNullableDate' }
            signature: { $ref: '#/components/schemas/EmployeeClearanceSignature' }
          additionalProperties: false
        itManager:
          type: object
