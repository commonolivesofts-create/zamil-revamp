  /api/v1/hr/employee-clearance:
    get:
      operationId: listEmployeeClearances
      tags: [HR Employee Clearance]
      summary: List Employee Clearance requests
      description: >-
        Requires `HR.EMPLOYEE_CLEARANCE:VIEW` (checked on every request).
        Results include requests for the caller and verified direct reports, determined by the
        employee-master PERSON_ID / SUPERVISOR_ID relationship. A caller holding
        `HR.EMPLOYEE_CLEARANCE:VIEW_ALL` can see all requests. The `pendingAt`
        filter is accepted for compatibility but currently returns an empty result whenever
        supplied; workflow lookup is not implemented. Results are ordered by header ID descending.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: status
          in: query
          description: Status filter; comparison is case-insensitive. `ALL` disables this filter.
          schema:
            type: string
            enum: [Draft, InProcess, Approved, Accepted, Rejected, ALL]
        - name: q
          in: query
          description: Case-insensitive contains search on employee name, employee number, or reference number.
          schema: { type: string, maxLength: 150 }
        - name: empNo
          in: query
          description: Exact positive integer employee number.
          schema: { type: integer, minimum: 1 }
        - name: department
          in: query
          description: Case-insensitive contains search on department.
          schema: { type: string, maxLength: 150 }
        - name: purpose
          in: query
          description: Case-insensitive contains search on purpose.
          schema: { type: string, maxLength: 150 }
        - name: createdFrom
          in: query
          description: Inclusive creation-date lower bound.
          schema: { type: string, format: date }
        - name: createdTo
          in: query
          description: Inclusive creation-date upper bound.
          schema: { type: string, format: date }
        - name: pendingAt
          in: query
          description: >-
            Compatibility filter only. Any non-empty value currently produces no results;
            workflow lookup is not implemented.
          schema: { type: string, maxLength: 150 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Filtered page; pagination fields are inside `data`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeClearanceListResponse' }
              example:
                success: true
                data:
                  page: 1
                  pageSize: 25
                  total: 1
                  items:
                    - headerId: '42'
                      referenceNo: EC/26/042
                      empNo: 12345
                      empName: Example Employee
                      jobTitle: Technician
                      department: Operations
                      contact: '5550100'
                      division: '300000003618177'
                      purpose: Employee clearance
                      computerReturned: true
                      status: Draft
                      vacationFrom: null
                      vacationTo: null
                      pendingAt: null
                      workflowStarted: null
                      workflowEnded: null
                      createdAt: '2026-10-31'
                  meta:
                    requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createEmployeeClearance
      tags: [HR Employee Clearance]
      summary: Create an Employee Clearance request
      description: >-
        Requires `HR.EMPLOYEE_CLEARANCE:CREATE` and a session-bound
        `X-CSRF-Token`. The employee must be the caller or a direct report, unless the caller
        holds `HR.EMPLOYEE_CLEARANCE:VIEW_ALL`. Employee, manager, destination,
        checkbox flags, matrix subjects, identifiers, reference number, and creation status are
        resolved or generated server-side. The initial status is `Draft`.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeClearanceWrite' }
            example:
              employee: { empNo: 12345 }
              contact: '5550100'
              purpose: Employee clearance
              vacationFrom: '2026-11-01'
              vacationTo: '2026-11-15'
              departmentManager:
                name: Example Manager
                date: '2026-10-31'
                signature: ''
              itManager: { name: '', date: null, signature: '' }
              computerReceivedBy: it
              computerSignature: ''
              sections:
                employeeDept:
                  items: [files, tools]
                  comments: ''
                  cost: null
                  approver: ''
                  signature: ''
              itMatrix:
                - { action: no action, accessTo: '' }
                - { action: no action, accessTo: '' }
                - { action: no action, accessTo: '' }
                - { action: no action, accessTo: '' }
                - { action: no action, accessTo: '' }
      responses:
        '201':
          description: Created. Returns the generated ID, reference number, and Draft status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeClearanceCreateResponse' }
              example:
                success: true
                data: { headerId: '42', referenceNo: '300000003618177/26/042', status: Draft }
                meta: { requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404':
          description: Employee does not exist or is outside the caller's employee scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
