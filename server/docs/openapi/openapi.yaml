      tags: [Authentication Recovery]
      summary: Reset the password with a reset link
      description: >-
        Consumes a PASSWORD_RESET token (30 min, single use). The new password must
        satisfy the policy and differ from the current one. Clears the lockout,
        revokes every session and outstanding reset token. MFA remains required at
        the next sign-in. Audited as PASSWORD_CHANGED / PASSWORD_RESET.
