      summary: Get an approved idea for a Project Charter
      description: >-
        Requires `HR.PROJECT_CHARTERS:VIEW`. The idea ID is a positive decimal
        string. The service returns `400 VALIDATION_ERROR` if the idea is not approved.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: ideaId
          in: path
