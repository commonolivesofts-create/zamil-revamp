    EmployeeClearanceId:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      description: Positive Oracle header identifier represented as a decimal string.
    EmployeeClearanceNullableDate:
      oneOf:
        - type: string
          format: date
        - type: 'null'
        - type: string
          const: ''
      description: ISO calendar date, null, or an empty string.
    EmployeeClearanceSignature:
      type: string
      enum: ['', Approved, Rejected, Hold]
      default: ''
    EmployeeClearanceSectionCommonWrite:
      type: object
      properties:
        comments: { type: [string, 'null'], maxLength: 2000, default: '' }
        approver: { type: [string, 'null'], maxLength: 500, default: '' }
        signature: { $ref: '#/components/schemas/EmployeeClearanceSignature' }
    EmployeeClearanceEmployeeDeptWrite:
      allOf:
        - $ref: '#/components/schemas/EmployeeClearanceSectionCommonWrite'
        - type: object
          properties:
            items:
              type: array
              uniqueItems: true
              default: []
              items:
                type: string
                enum:
                  - files
                  - tools
                  - instruments
                  - book_manuals
                  - manuals
                  - office_keys
                  - documents
                  - locker_keys
                  - safety_items
                  - vehicle
                  - office_stationary
                  - others
            cost: { type: [number, 'null'], minimum: 0, default: null }
      unevaluatedProperties: false
    EmployeeClearanceQualityWrite:
      allOf:
        - $ref: '#/components/schemas/EmployeeClearanceSectionCommonWrite'
        - type: object
          properties:
            items:
              type: array
              uniqueItems: true
              default: []
              items: { type: string, enum: [uniform, knife, documents, others] }
            cost: { type: [number, 'null'], minimum: 0, default: null }
      unevaluatedProperties: false
    EmployeeClearanceWarehouseWrite:
      allOf:
        - $ref: '#/components/schemas/EmployeeClearanceSectionCommonWrite'
        - type: object
          properties:
            items:
              type: array
              uniqueItems: true
              default: []
              items: { type: string, enum: [tools, others] }
            cost: { type: [number, 'null'], minimum: 0, default: null }
      unevaluatedProperties: false
    EmployeeClearanceAccountsWrite:
      allOf:
        - $ref: '#/components/schemas/EmployeeClearanceSectionCommonWrite'
        - type: object
          properties:
            items:
              type: array
              uniqueItems: true
              default: []
              items: { type: string, enum: [loans, others] }
            cost: { type: [number, 'null'], minimum: 0, default: null }
      unevaluatedProperties: false
    EmployeeClearanceAdminWrite:
      allOf:
        - $ref: '#/components/schemas/EmployeeClearanceSectionCommonWrite'
        - type: object
          properties:
            items:
              type: array
              uniqueItems: true
              default: []
              items:
                type: string
                enum:
                  - iqama
                  - id_cards
                  - bank_loan
                  - driving_license
                  - gurantor
                  - mobile_chip
                  - medical_cards
                  - door_attendance
                  - others
            appDate: { $ref: '#/components/schemas/EmployeeClearanceNullableDate' }
            visaExpiry: { $ref: '#/components/schemas/EmployeeClearanceNullableDate' }
      unevaluatedProperties: false
    EmployeeClearanceSectionsWrite:
      type: object
      properties:
        employeeDept: { $ref: '#/components/schemas/EmployeeClearanceEmployeeDeptWrite' }
        quality: { $ref: '#/components/schemas/EmployeeClearanceQualityWrite' }
        warehouse: { $ref: '#/components/schemas/EmployeeClearanceWarehouseWrite' }
        accounts: { $ref: '#/components/schemas/EmployeeClearanceAccountsWrite' }
        admin: { $ref: '#/components/schemas/EmployeeClearanceAdminWrite' }
      additionalProperties: false
      description: >-
        Each section defaults to an empty selection and blank comments/approver/signature.
    EmployeeClearanceITMatrixLineWrite:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum:
            - delete
            - no action
            - remote access
            - copy give to
            - forward copy to
            - cisco jaber
            - disabled untill
        accessTo:
          type: [string, 'null']
          maxLength: 500
          description: >-
            Required as an ISO date for `disabled untill`. A date-shaped value is rejected for
