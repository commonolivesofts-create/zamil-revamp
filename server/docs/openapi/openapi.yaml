        record (README Â§7.4) receives 404. Requires `HR.REQUISITIONS:VIEW`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequisitionId'
      responses:
        '200':
          description: Success.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
