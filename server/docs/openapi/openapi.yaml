  /api/v1/hr/tourist-visa-letters:
    get:
      operationId: listTouristVisaLetters
      tags: [HR Tourist Visa Letters]
      summary: List tourist visa letters
      description: >-
        Requires `HR.TOURIST_VISA_LETTERS:VIEW` and an authenticated session. Set `limit=0` to
        return all matches. Results use the requested sort and order with ID descending as a
        tie-breaker. The response has `Cache-Control: no-store`.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000, default: 25 }
        - name: search
          in: query
          schema: { type: [string, 'null'], maxLength: 200 }
        - name: ref_no
          in: query
          schema: { type: [string, 'null'], maxLength: 100 }
        - name: division
          in: query
          schema: { type: string, enum: [ZPIL, Z3P] }
        - name: country
          in: query
          schema: { type: [string, 'null'], maxLength: 150 }
        - name: employee_no
          in: query
          schema: { type: [string, 'null'], maxLength: 80 }
        - name: approval_name
          in: query
          schema: { type: [string, 'null'], maxLength: 200 }
        - name: date_from
          in: query
          schema: { $ref: '#/components/schemas/TouristVisaDate' }
        - name: date_to
          in: query
          schema: { $ref: '#/components/schemas/TouristVisaDate' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, ref_no, employee_no, employee_name, country, division, cur_date, created_at]
            default: id
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Paginated tourist visa letters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TouristVisaListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '503':
          description: Tourist visa table metadata could not be verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createTouristVisaLetter
      tags: [HR Tourist Visa Letters]
      summary: Create a tourist visa letter
      description: >-
        Requires `HR.TOURIST_VISA_LETTERS:CREATE`, an authenticated session, and `X-CSRF-Token`.
        Employee identity and salary are loaded from the employee master at creation; UUID,
        reference number, and creation audit fields are assigned by the server. Country and
        approver values are checked against lookup data. The response has `Cache-Control: no-store`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TouristVisaCreate' }
      responses:
        '201':
          description: Tourist visa letter created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TouristVisaLetterResponse' }
        '400':
          description: Request data is invalid, employee data is incomplete, or a country or approver is unknown.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '409':
          description: Employee lookup is ambiguous or a unique reference number could not be generated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Tourist visa table metadata could not be verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
