        (pageSize is reported as pagination.limit).
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [DRAFT, INPROCESS, APPROVED, REJECTED] },
          }
        - {
            name: department,
            in: query,
            schema: { type: string, enum: [production, shared-services] },
          }
        - { name: employeeNumber, in: query, schema: { type: string, maxLength: 100 } }
        - { name: requestNo, in: query, schema: { type: string, maxLength: 100 } }
        - { name: date_from, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: date_to, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum: [headerId, requestNo, employeeName, activityDate, status, createdAt],
                default: createdAt,
              },
          }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
