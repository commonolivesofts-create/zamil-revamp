  /api/v1/hr/requisitions/{requisitionId}/recruitment-status:
    post:
      operationId: changeRequisitionRecruitmentStatus
      tags: [HR Requisitions]
      summary: Perform an audited recruitment action on an approved requisition
      description: >-
        Requires requisition UPDATE permission, CSRF and server-verified HR membership.
        Locks the approved requisition and checks expectedStatus against the current value.
        Open supports hold/cancel; Offer Accepted supports fill/hold/cancel; On Hold supports
        reopen/cancel; Cancelled supports reopen. Reopen restores Offer Accepted when an actual
        acceptance date exists, otherwise Open. Filled / Closed is terminal. Every successful
        change atomically records actor, time, old/new values and optional reason in the audit log.
        Offer Accepted is produced by the offer acceptance action, not this endpoint.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequisitionId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, expectedStatus]
              properties:
                action: { type: string, enum: [hold, cancel, reopen, fill] }
                expectedStatus:
                  { type: string, enum: [Open, Accepted, Close, 'On Hold', Cancelled] }
                reason: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Recruitment action and audit event committed together.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          requisitionId: { type: string }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          description: Requisition not found.
        '409':
          description: Not approved, stale expected status or action unavailable for the current status.
