  /api/v1/hr/probation-evaluations:
    get:
      operationId: listProbationEvaluations
      tags: [HR Probation Evaluations]
      summary: List probation evaluations
      description: >-
        Returns filtered, paginated PAF records. HR membership is checked server-side
        against XX_DIGI_LOOKUP_VALUES (LOOKUP_TYPE 'XXZP_HR', MEANING equal to the
        authenticated employee number); other actors are scoped to their own CREATED_BY.
        Each row carries the derived evaluationResult (TOTAL_RATING 71â€“100 ACCEPTABLE,
        0â€“70 NOT_ACCEPTABLE) and pendingAt, the legacy report's Pending At: TO_USER of the open
        CI3 workflow step (XXPHP_WORKFLOW, MSG_TYPE EPRBF, USER_KEY = HEADER_ID, STATUS Open,
        TYPE_PARAM null), or null. Requires `HR.PROBATION_EVALUATIONS:VIEW` (default-deny
        catalogue authorization).
      security:
        - sessionCookie: []
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100000, default: 1 },
          }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - {
            name: requestStatus,
            in: query,
            schema: { type: string, enum: [DRAFT, INPROCESS, APPROVED, REJECTED] },
          }
        - {
            name: formType,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [
                    Workers_Technicians,
                    Trainee,
                    Engineers_Staff,
                    Department_Managers,
                    Supervisors_and_Foremens,
                  ],
              },
          }
        - { name: empNumber, in: query, schema: { type: string, maxLength: 50 } }
        - { name: department, in: query, schema: { type: string, maxLength: 200 } }
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, schema: { type: string, format: date } }
        - {
            name: sortBy,
            in: query,
            schema:
              {
                type: string,
                enum: [HEADER_ID, CREATED_AT, EMP_NAME, TOTAL_RATING],
                default: HEADER_ID,
              },
          }
        - { name: sortDir, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Paginated probation evaluations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ProbationEvaluationListItem' }
                      pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      operationId: createProbationEvaluation
      tags: [HR Probation Evaluations]
      summary: Create a draft probation evaluation
      description: >-
        The legacy create form (Probation_Model::add_form_data). Inserts one DRAFT header and
        one line per criterion of the form type (see lookups/criteria) atomically; the ratings
        are taken by position (blank = 0) and criterion texts never come from the client. The
        employee must be in the signed-in user's hierarchy (lookups/employees, else 403); the
        employee number, name, job title and department are read from the employee master.
        Comments, Suggestion, evaluation period and person ID are stored as '-' and the grade
        as 0, as the legacy create form leaves them empty. Prepared by is the signed-in user and
        TOTAL_RATING is computed. 422 `PROBATION_CRITERIA_UNAVAILABLE` when the form type has no
        criteria. Requires `HR.PROBATION_EVALUATIONS:CREATE` and the X-CSRF-Token header.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProbationEvaluationWriteRequest' }
      responses:
        '201':
          description: Created draft.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [headerId, uuid]
                        properties:
                          headerId: { $ref: '#/components/schemas/Id' }
                          uuid: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '422':
          description: The criteria of the form type are not available (PROBATION_CRITERIA_UNAVAILABLE).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/hr/probation-evaluations/lookups/criteria:
    get:
      operationId: listProbationEvaluationCriteria
      tags: [HR Probation Evaluations]
      summary: List the criteria of a form type
      description: >-
        The evaluation criteria of a form type, English and Arabic, in order (legacy
        showDropInfo). Legacy rendered them from assets/prf-new.js, which is not in the
        repository, and copied each one into every saved evaluation; they are read from the
        latest evaluation of that type that holds all 20 named criteria. Empty when there is
        none. Requires `HR.PROBATION_EVALUATIONS:VIEW`.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: formType
          in: query
          required: true
          schema:
            type: string
            enum:
              [
                Workers_Technicians,
                Trainee,
                Engineers_Staff,
                Department_Managers,
                Supervisors_and_Foremens,
              ]
      responses:
        '200':
          description: Criteria of the form type.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [formType, criteria]
                        properties:
                          formType: { type: string }
                          criteria:
                            type: array
                            maxItems: 20
                            items:
                              type: object
                              required: [param, paramAr]
                              properties:
                                param: { type: string }
                                paramAr: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/hr/probation-evaluations/lookups/form-types:
    get:
      operationId: listProbationEvaluationFormTypes
      tags: [HR Probation Evaluations]
      summary: List probation evaluation form types
      description: Static form type values from the PAF form. Requires `HR.PROBATION_EVALUATIONS:VIEW`.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Form type values.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          formTypes:
                            type: array
                            items: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
  /api/v1/hr/probation-evaluations/lookups/employees:
    get:
      operationId: listProbationEvaluationEmployees
