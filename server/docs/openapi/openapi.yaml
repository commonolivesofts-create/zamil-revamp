        as a string but is not used by the current repository query.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: [string, 'null'], maxLength: 100 }
        - name: scope
          in: query
          schema: { type: [string, 'null'], maxLength: 30 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: A page of matching employees.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectCharterEmployeesResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/charters/lookups/employees/{empNo}:
    get:
      operationId: getProjectCharterEmployee
      tags: [Project Charters]
      summary: Get an employee for a Project Charter
      description: Requires an authenticated session and `HR.PROJECT_CHARTERS:VIEW`.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: empNo
          in: path
          required: true
          schema: { type: string, maxLength: 30, minLength: 1 }
      responses:
        '200':
          description: Employee details.
          content:
            application/json:
