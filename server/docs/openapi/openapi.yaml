  /api/v1/hr/reports/periodwise-employees:
    get:
      operationId: getPeriodwiseEmployeesReport
      tags: [HR Periodwise Employees]
      summary: Periodwise employees report
      description: >-
        Employees attached to the department (current XX_DIGI_EMP_MASTER department) at any
        point in [dateFrom, dateTo]: joined on or before dateTo and not terminated before dateFrom.
        `department`, `status` and the period form the scope; `data.summary` holds the KPIs and
        chart data of the whole scope. `search`, `nationality`, `ageBand` and `flagged` narrow
        only `data.rows`, which are then sorted and paged. The national ID is never returned,
        only `hasNationalId`. Requires `HR.PERIODWISE_EMPLOYEES:VIEW`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: dateFrom, in: query, required: true, schema: { type: string, format: date } }
        - {
            name: dateTo,
            in: query,
            required: true,
            description: On or after dateFrom.,
            schema: { type: string, format: date },
          }
        - {
            name: department,
            in: query,
            description: ALL or an ORGANIZATION_ID from the departments lookup.,
            schema: { type: string, pattern: '^(ALL|[0-9]{1,19})$', default: ALL },
          }
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [ALL, ACTIVE, LEFT], default: ALL },
          }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: nationality, in: query, schema: { type: string, maxLength: 100 } }
        - {
            name: ageBand,
            in: query,
            schema: { type: string, enum: [UNDER_30, 30_39, 40_49, 50_59, 60_PLUS] },
          }
        - { name: flagged, in: query, schema: { type: boolean, default: false } }
        - {
            name: sortBy,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [
                    employeeNumber,
                    name,
                    birthDate,
                    age,
                    nationality,
                    jobTitle,
                    departmentName,
                    position,
                    startDate,
                    years,
                    endDate,
                    leavingReason,
                  ],
                default: employeeNumber,
              },
          }
        - { name: sortDir, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100000, default: 1 },
          }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        '200':
          description: One page of rows, the pagination and the summary of the full scope.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, pagination, meta]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [rows, summary]
                    properties:
                      rows:
                        type: array
                        items:
                          type: object
                          properties:
                            employeeNumber: { type: string }
                            name: { type: string }
                            birthDate: { type: [string, 'null'], format: date }
                            age: { type: [integer, 'null'] }
                            nationality: { type: string }
                            jobTitle: { type: string }
                            position: { type: string }
                            departmentCode: { type: [string, 'null'] }
                            departmentName: { type: string }
                            hasNationalId: { type: boolean }
                            startDate: { type: string, format: date }
                            endDate: { type: [string, 'null'], format: date }
                            years: { type: number }
                            leavingReason: { type: string }
                            active: { type: boolean }
                            senior: { type: boolean, description: Aged 60 or over. }
                            flags:
                              type: array
                              items: { type: string, enum: [BIRTH_DATE, NATIONAL_ID] }
                      summary:
                        type: object
                        properties:
                          total: { type: integer }
                          active: { type: integer }
                          joiners: { type: integer }
                          leavers: { type: integer }
                          turnover: { type: number }
                          saudization: { type: number }
                          averageAge: { type: number }
                          senior: { type: integer }
                          averageService: { type: number }
                          flagged: { type: integer }
                          byDepartment:
                            type: array
                            items:
                              type: object
                              properties:
                                code: { type: [string, 'null'] }
                                name: { type: string }
                                count: { type: integer }
                          byNationality:
                            type: array
                            items:
                              type: object
                              properties: { name: { type: string }, count: { type: integer } }
                          ageBands:
                            type: array
                            items:
                              type: object
                              properties: { band: { type: string }, count: { type: integer } }
                          yearlyFlow:
                            type: array
                            items:
                              type: object
                              properties:
                                year: { type: string }
                                joiners: { type: integer }
                                leavers: { type: integer }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  meta: { type: object }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
