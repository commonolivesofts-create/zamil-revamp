                files:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Uploaded; the current attachment list of the requisition.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [requisitionId, attachments]
                        properties:
                          requisitionId:
                            $ref: '#/components/schemas/Id'
                          attachments:
                            type: array
                            items:
                              $ref: '#/components/schemas/RequisitionAttachment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/hr/requisitions/{requisitionId}/attachments/{attachmentId}:
    delete:
      operationId: deleteRequisitionAttachment
