          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: The required Oracle schema cannot be verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: deleteSickLeaveRequest
      tags: [HR Sick Leave]
      summary: Delete an editable Sick Leave request
      description: >-
        Requires the configured Sick Leave resource's DELETE action and a session-bound CSRF
        token. Only Draft or REJECTED requests can be deleted. In addition to HR visibility,
        the authenticated user must be the request creator; being the employee on the request
        alone does not grant delete access. Attachment metadata is deleted with the request.
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: headerId,
            in: path,
            required: true,
            schema: { $ref: '#/components/schemas/SickLeaveId' },
          }
        - { $ref: '#/components/parameters/CsrfToken' }
      responses:
        '200':
          description: Request deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SickLeaveDeleteResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404':
          description: The request is missing or is outside the caller's record scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: The request status does not permit deletion (STATE_CONFLICT).
