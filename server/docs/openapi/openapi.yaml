    SickLeaveId:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      description: Positive decimal identifier, supplied as a path string.
    SickLeaveWrite:
      type: object
      additionalProperties: false
      required: [empNumber, fromDate, toDate, fromDayType, toDayType, comments]
      properties:
        empNumber: { type: string, maxLength: 40 }
        leaveType:
          type: string
          enum: [Sick Leave]
          default: Sick Leave
          description: Optional; the server always stores "Sick Leave" (legacy fixed value).
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        fromDayType: { type: string, enum: [FULL, HALF] }
        toDayType: { type: string, enum: [FULL, HALF] }
        comments: { type: string, minLength: 1, maxLength: 2000 }
        days:
          description: Accepted but stripped; the server calculates the leave duration.
        empName:
          description: Accepted but stripped; the server resolves the employee name.
        status:
          description: Accepted but stripped; status is not client-writable.
        createdBy:
          description: Accepted but stripped; creator identity comes from the session.
    SickLeaveCreateMultipart:
      type: object
      additionalProperties: false
      required: [empNumber, fromDate, toDate, fromDayType, toDayType, comments, files]
      properties:
        empNumber: { type: string, maxLength: 40 }
        leaveType:
          type: string
          enum: [Sick Leave]
          default: Sick Leave
          description: Optional; the server always stores "Sick Leave" (legacy fixed value).
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        fromDayType: { type: string, enum: [FULL, HALF] }
        toDayType: { type: string, enum: [FULL, HALF] }
        comments: { type: string, minLength: 1, maxLength: 2000 }
        days: { description: Accepted but stripped; the server calculates this value. }
        empName: { description: Accepted but stripped; the server resolves this value. }
        status: { description: Accepted but stripped; status is not client-writable. }
        createdBy: { description: Accepted but stripped; creator identity comes from the session. }
        files:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: binary
          description: >-
            Files with extensions jpg, jpeg, png, gif, txt, doc, docx, pdf, xls,
            xlsx, csv, html, ppt, pptx, odt or xml; maximum 10 MiB per file.
    SickLeaveAttachmentsUpload:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: binary
          description: >-
            Files with extensions jpg, jpeg, png, gif, txt, doc, docx, pdf, xls,
            xlsx, csv, html, ppt, pptx, odt or xml; maximum 10 MiB per file.
    SickLeaveEmployee:
      type: object
      required: [empNumber, empName, department]
      properties:
        empNumber: { type: string }
        empName: { type: [string, 'null'] }
