  /api/v1/hr/employment-offers/{headerId}/accept:
    post:
      operationId: recordEmploymentOfferAcceptance
      tags: [Employment Offers]
      summary: Record actual offer acceptance and update linked recruitment status
      description: >-
        Requires offer UPDATE permission, CSRF and server-verified HR membership.
        Locks the offer and linked requisition and atomically stores offer status Accepted,
        requisition ATTRIBUTE1 Accepted (Offer Accepted) and the actual acceptance date in
        ATTRIBUTE14. Approval status is untouched. Identical retries are idempotent;
        a different acceptance or a non-open requisition returns 409.
      security:
        - sessionCookie: []
      parameters:
        - name: headerId
          in: path
          required: true
          schema: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [acceptedDate]
              properties:
                acceptedDate:
                  type: string
                  format: date
                  description: Actual candidate acceptance date, from offer date through today in Asia/Riyadh.
                reason: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Offer and requisition acceptance recorded atomically.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          headerId: { type: string }
                          requisitionId: { type: string }
                          acceptedDate: { type: string, format: date }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
