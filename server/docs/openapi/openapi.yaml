  /api/v1/auth/recovery/request:
    post:
      operationId: requestRecovery
      tags: [Authentication Recovery]
      summary: Request a password reset or MFA recovery link
      description: >-
        Anonymous self-service request. Always 202 with the same body for every
        username (no enumeration); the account lookup, token and e-mail are processed
        after the response, so its timing does not depend on the account. PASSWORD_RESET: ordinary employees and the Super
        Administrator; MFA_RECOVERY: the Super Administrator only (pinned address).
        Other privileged accounts are recovered by the Super Administrator. 503
        DELIVERY_UNAVAILABLE for every request while no delivery channel is
        configured. Rate limited per client; one link per account and type per 5
        minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
      responses:
        '202':
          description: Accepted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RecoveryAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DeliveryUnavailable'
