  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Liveness probe
      description: >-
        Confirms that the API process is running and able to respond. Does not
        check Oracle or any other dependency. No authentication required.
      responses:
        '200':
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Liveness'
              example:
                success: true
                data:
                  status: UP
                meta:
                  requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '500':
          $ref: '#/components/responses/InternalError'
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Readiness probe
      description: >-
        Confirms that the instance can serve work: both Oracle connection pools
        (LOW and HIGH) must complete a bounded, read-only check. Results are reused
        for a short period and concurrent requests share one check, so frequent
        probes cannot exhaust the pools. No authentication required. Database
        identities, hosts and driver errors are never returned.
      responses:
        '200':
          description: The instance is ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Readiness'
              example:
                success: true
                data:
                  status: READY
                  database:
                    LOW: UP
                    HIGH: UP
                meta:
                  requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '503':
          description: A required database pool is unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: SERVICE_UNAVAILABLE
                  message: The service is not ready
                  details:
                    - field: database.HIGH
                      message: Database pool is unavailable
                meta:
                  requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/hr/personnel-record-changes:
    get:
      operationId: listPersonnelRecordChanges
      tags: [HR Personnel Record Changes]
      summary: List personnel record changes with optional filters and pagination
      description: >-
        Requires HR.PERSONNEL_RECORD_CHANGES:VIEW. HR users (fail-closed XXZP_HR check) see every
        request; other users see the requests they created and requests for employees of their
        own department. Rows carry the legacy report columns, including requestor and pendingAt
        (the open RCF workflow notification's recipient, read only).
        Pagination metadata is included inside data.meta and total is a database count.
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: search,
            in: query,
            schema: { type: string },
            description: 'Case-insensitive search across employee number, employee name and reference number.',
          }
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [DRAFT, INPROCESS, APPROVED, REJECTED] },
          }
        - { name: section, in: query, schema: { type: string } }
        - { name: department, in: query, schema: { type: string } }
        - {
            name: position,
            in: query,
            schema: { type: string },
            description: Matches NEW_POSITION.,
          }
        - {
            name: requestor,
            in: query,
            schema: { type: string, pattern: '^[1-9][0-9]{0,18}$' },
            description: Matches CREATED_BY.,
          }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum: [headerId, empNo, empName, formDate, status, oldTotal, newTotal],
                default: headerId,
              },
          }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Filtered page and total count.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [meta, rows]
                    properties:
                      meta:
                        type: object
                        properties:
                          page: { type: integer }
                          pageSize: { type: integer }
                          total: { type: integer }
                          sort: { type: string }
                          order: { type: string, enum: [asc, desc] }
                      rows:
                        {
                          type: array,
                          items: { $ref: '#/components/schemas/PersonnelRecordChangeListItem' },
                        }
                  meta: { $ref: '#/components/schemas/ResponseMeta' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createPersonnelRecordChange
      tags: [HR Personnel Record Changes]
      summary: Create a personnel record change
      description: >-
        Requires HR.PERSONNEL_RECORD_CHANGES:CREATE. HEADER_ID (identity column), REF_NO
        (zero-padded ID + '-' + section), STATUS (DRAFT), USER_ID, signatures and creation audit
        values are server-owned. FORM_DATE is today (Asia/Riyadh) and ARB_DATE its Hijri date. The
        employee snapshot (name, nationality, section, department, start date and the current
        position, pay items and TOTAL_SALARY) comes from the employee master or the employee's
        latest request; body values for those fields are ignored. NEW_TOTAL is the sum of the six
        revised items.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonnelRecordChangeWrite' }
      responses:
