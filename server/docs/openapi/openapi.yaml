        supplied range: START_DATE is on/after date_from and END_DATE is on/before date_to;
        open-ended rows (END_DATE NULL) are included for date_to. Pagination uses a COUNT
        query, allowlisted sorting and EMP_ID as the stable final tie-breaker. Requires
        HR.CONTRACTOR_EMPLOYEES:VIEW.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: division, in: query, schema: { type: string } }
        - { name: department, in: query, schema: { type: string } }
        - { name: contractor_number, in: query, schema: { type: string, pattern: '^[0-9]{1,18}$' } }
        - { name: status, in: query, schema: { type: string, enum: [Active, Inactive, ALL] } }
        - { name: date_from, in: query, required: true, schema: { type: string, format: date } }
        - { name: date_to, in: query, required: true, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - {
            name: sort,
            in: query,
            schema:
              {
                type: string,
                enum: [employee_number, employee_name, start_date, end_date, status, con_number],
                default: employee_number,
              },
          }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        '200':
          description: Filtered page and total count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
                  data: { type: array, items: { $ref: '#/components/schemas/ContractorEmployee' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createContractorEmployee
      tags: [HR Contractor Employees]
      summary: Create a contractor employee
      description: >-
        Locks the contractor row, generates EMP_ID and EMPLOYEE_NUMBER, resolves contractor,
        job title and boss names on the server, then inserts in one transaction. Client-supplied
        IDs and derived labels are ignored. Requires HR.CONTRACTOR_EMPLOYEES:CREATE.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractorEmployeeWrite' }
      responses:
        '201':
          description: Created employee identifiers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { const: true }
                  data:
                    type: object
                    properties:
                      emp_id: { $ref: '#/components/schemas/Id' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
