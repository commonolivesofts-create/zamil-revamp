  /api/v1/workflow-manager/overview:
    get:
      operationId: getWorkflowManagerOverview
      tags: [Workflow Manager]
      summary: Workflow Manager overview counts
      description: >-
        Live counts of the Form Registry (XX_ZRV_WF_FORMS) and Data Source Registry
        (XX_ZRV_WF_DATA_SOURCES). Requires `WORKFLOW_MANAGER.OVERVIEW:VIEW`. Each
        section is returned only when the caller also holds that registry's VIEW
        permission; otherwise it is `null`. No workflow runtime data exists in Phase 1.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Counts for the registries the caller may view.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WorkflowOverview'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/workflow-manager/lookups/modules:
    get:
      operationId: listWorkflowFormModules
