              enum: [ALLOW, DENY]
            justification:
              type: string
            isActive:
              type: boolean
            expiresAt:
              type: [string, 'null']
              format: date-time
    OverrideRequest:
      type: object
      additionalProperties: false
      required: [effect, justification]
      properties:
        effect:
          enum: [ALLOW, DENY]
        justification:
          type: string
          minLength: 1
          maxLength: 500
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: ISO 8601 instant in the future; null or absent for no expiry.
    ChangeResult:
      type: object
      description: >-
