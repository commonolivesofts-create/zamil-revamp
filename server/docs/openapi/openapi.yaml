  /api/v1/hr/requisitions/{requisitionId}:
    get:
      operationId: getRequisition
      tags: [HR Requisitions]
      summary: Read one requisition
      description: >-
        The header row with its attachment rows (xxzp_all_attachments,
        FORM_NAME 'Requisition'); business dates come back in the stored legacy
        'DD-Mon-YY' form, ATTACHED_ON as 'DD-Mon-YYYY'. Out-of-scope rows are
        indistinguishable from missing ones: a non-HR caller who may not read a
        record (README §7.4) receives 404. Requires `REQUISITIONS.REQUISITIONS:VIEW`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequisitionId'
      responses:
        '200':
          description: Success.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RequisitionDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateRequisition
      tags: [HR Requisitions]
      summary: Update a requisition
      description: >-
        Full replace of the business fields of an existing requisition in ONE
        transaction (the edit form submits the whole payload). Frozen and never
        updated (README §5.1): REQUISITION_STATUS, REQUISITION_NUMBER, REQUEST_DATE,
        REQUESTER_NAME, REQUESTED_BY — requestDate is therefore rejected on this
        operation as an unknown field. Non-HR callers get 409 CANNOT_UPDATE_STATUS
        while the status is Inprocess or Approved (HR users may always save).
        ticketStatus is HR-only; when absent it preserves the stored ATTRIBUTE1/14/15
        group, when '' it clears it, and while the status is Accepted/Close the
        previously stored date survives a re-save (corrected §5.1 behaviour).
        Multipart requests may append attachment file parts (`files`) in the same
        transaction. Out-of-scope rows 404. Requires `REQUISITIONS.REQUISITIONS:UPDATE` and
        the `X-CSRF-Token` header.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequisitionId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequisitionUpdate'
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/RequisitionUpdate'
                - type: object
                  properties:
                    files:
                      type: array
                      maxItems: 10
                      items:
                        type: string
                        format: binary
      responses:
        '200':
          description: Success; the requisitionId that was updated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [requisitionId]
                        properties:
                          requisitionId:
                            $ref: '#/components/schemas/Id'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RequisitionUpdateConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteRequisition
      tags: [HR Requisitions]
      summary: Delete a requisition
      description: >-
        Deletes the header and its attachment rows in ONE transaction, then removes
        the physical attachment files. Two uniform guards (no bypass, HR included):
        409 CANNOT_DELETE_STATUS when REQUISITION_STATUS is not 'Draft', and 409
        REQUISITION_IN_USE when an interview assessment references the requisition
        number in ATTRIBUTE4. Out-of-scope rows 404. Requires
        `REQUISITIONS.REQUISITIONS:DELETE` and the `X-CSRF-Token` header.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequisitionId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Deleted; `deleted` is always true.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [requisitionId, deleted]
                        properties:
                          requisitionId:
                            $ref: '#/components/schemas/Id'
                          deleted:
                            const: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RequisitionDeleteConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/hr/requisitions/{requisitionId}/attachments:
    post:
      operationId: uploadRequisitionAttachments
      tags: [HR Requisitions]
      summary: Upload requisition attachments
      description: >-
        Appends attachment rows (FORM_HEADER_ID = requisitionId, FORM_NAME
        'Requisition') and writes the physical files in ONE transaction, compensated
        on failure. Multipart only, at least one file part named `files`, max 10
        files, 10 MB each, README §9 extension allowlist. Returns the full current
        attachment list. Out-of-scope or missing requisitions 404. Requires
        `REQUISITIONS.REQUISITIONS:MANAGE_ATTACHMENTS` and the `X-CSRF-Token` header.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequisitionId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
