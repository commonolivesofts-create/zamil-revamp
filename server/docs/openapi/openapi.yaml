        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: The required day-type schema cannot be verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    put:
      operationId: updateSickLeaveRequest
      tags: [HR Sick Leave]
      summary: Replace the editable Sick Leave request fields
      description: >-
        Requires the configured Sick Leave resource's UPDATE action and a session-bound CSRF
        token. Only requests in Draft or REJECTED status can be updated. The server recalculates
        leave duration and validates the employee and configured leave-type lookup. The JSON
        body uses the same fields as creation except attachments; client-supplied calculated or
        server-owned values are ignored. Required Oracle schema and lookup configuration are
        checked before writing.
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            name: headerId,
            in: path,
            required: true,
            schema: { $ref: '#/components/schemas/SickLeaveId' },
          }
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SickLeaveWrite' }
      responses:
        '200':
          description: Updated Sick Leave request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SickLeaveMutationResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404':
