  /api/v1/projects/charters:
    get:
      operationId: listProjectCharters
      tags: [Project Charters]
      summary: List Project Charters
      description: >-
        Requires an authenticated session and `HR.PROJECT_CHARTERS:VIEW`.
        Results are ordered by header ID descending. `from`/`to` filter expected project dates;
        `createdFrom`/`createdTo` filter charter creation dates. This list returns `total` and
        `items` in `data`; it does not use the shared top-level pagination object.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: q
          in: query
          description: Case-insensitive contains search on project name, project manager, or idea number.
          schema: { type: [string, 'null'], maxLength: 200 }
        - name: ideaNo
          in: query
          description: Exact idea number.
          schema: { type: [string, 'null'], maxLength: 100 }
        - name: status
          in: query
          description: The only accepted status filter.
          schema: { type: string, enum: [Pending] }
        - name: projectManager
          in: query
          schema: { type: [string, 'null'], maxLength: 200 }
        - name: processOwner
          in: query
          schema: { type: [string, 'null'], maxLength: 200 }
        - name: from
          in: query
          description: Expected project start date lower bound, YYYY-MM-DD.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: to
          in: query
          description: Expected project completion date upper bound, YYYY-MM-DD.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: createdFrom
          in: query
          description: Charter creation date lower bound, YYYY-MM-DD.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: createdTo
          in: query
          description: Charter creation date upper bound, YYYY-MM-DD.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Matching Project Charters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectCharterListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createProjectCharter
      tags: [Project Charters]
      summary: Create a Project Charter
      description: >-
        Requires `HR.PROJECT_CHARTERS:CREATE`, an authenticated session, and
        `X-CSRF-Token`. The idea must be approved. `HEADER_ID` is generated by the database
        identity column and returned by the insert; the API never calculates an ID or uses MAX+1.
        The charter starts as `Pending`; the creation date is the database date.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCharterCreate' }
      responses:
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '201':
          description: The created Project Charter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectCharterDetailResponse' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/charters/lookups/ideas:
    get:
      operationId: listApprovedProjectCharterIdeas
      tags: [Project Charters]
      summary: List approved ideas for Project Charters
      description: Requires an authenticated session and `HR.PROJECT_CHARTERS:VIEW`.
      security: [{ sessionCookie: [] }]
      responses:
