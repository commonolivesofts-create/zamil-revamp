      summary: List Arabic salary certificates
      description: >-
        Requires an authenticated session and
        `HR.SALARY_CERTIFICATES_AR:VIEW`. Results are ordered by ID descending.
        `from`/`to` filter certificate dates and `createdFrom`/`createdTo` filter
        creation dates; each upper date bound is inclusive. Pagination is returned
        inside `data`, not as a top-level pagination object.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: q
          in: query
          description: Case-insensitive contains search on employee name, employee number, reference number, or recipient.
          schema: { type: string, maxLength: 150 }
        - name: employeeNo
          in: query
          description: Exact employee number.
          schema: { type: string, maxLength: 80 }
        - name: division
          in: query
          description: Case-insensitive contains search on division.
          schema: { type: string, maxLength: 150 }
        - name: status
          in: query
          description: The only accepted status filter.
          schema: { type: string, enum: [DRAFT] }
        - name: from
          in: query
          description: Inclusive certificate-date lower bound, YYYY-MM-DD.
          schema: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: to
          in: query
          description: Inclusive certificate-date upper bound, YYYY-MM-DD.
          schema: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: createdFrom
          in: query
          description: Inclusive creation-date lower bound, YYYY-MM-DD.
          schema: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: createdTo
          in: query
          description: Inclusive creation-date upper bound, YYYY-MM-DD.
          schema: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Filtered page of certificates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArabicSalaryCertificateListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createArabicSalaryCertificate
      tags: [Arabic Salary Certificates]
      summary: Create an Arabic salary certificate
      description: >-
        Requires `HR.SALARY_CERTIFICATES_AR:CREATE`, an authenticated session, and
        `X-CSRF-Token`. Employee and salary snapshot values are loaded from the employee
        master, and the selected approver must be eligible. `joiningDate` and
        `allowanceFlag` are required consistency assertions; they are checked against
        server-owned employee data. The request returns `400` for mismatched assertions,
        incomplete employee data, or an ineligible approver. The created certificate starts
        in DRAFT.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CsrfToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArabicSalaryCertificateWrite' }
      responses:
        '201':
          description: Certificate created with its assigned reference number.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArabicSalaryCertificateCreateResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccessDenied' }
        '404':
          description: Employee not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Employee lookup is ambiguous or a certificate reference could not be assigned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
