openapi: 3.1.0
info:
  title: Zamil Digitalization API
  version: 2.1.0
  description: >-
    Backend API for Zamil Digitalization (modernization of the CI3 application). Exposes the operational
    foundation and the authentication foundation (password login with
    database-backed cookie sessions); business endpoints are documented here as
    they are implemented. Standards: server/docs/02-API_DEVELOPMENT_STANDARDS.md.


    **Browser security model.** Authentication uses an opaque, HttpOnly, Secure
    session cookie. Every state-changing request is subject to an Origin check
    (a present Origin or Referer must be the API's own origin or an allowlisted
    origin, and `Sec-Fetch-Site: cross-site` is refused). Authenticated
    state-changing requests also require the session-bound `X-CSRF-Token`
    header, obtained from the login response or `GET /api/v1/auth/csrf`.
    Interactive Swagger requests pass through the same controls.
servers:
  - url: /
    description: Current host
tags:
  - name: Authentication
    description: >-
      Password login, MFA enrollment and verification, current session, CSRF token and
      logout. Login username is the employee-master USER_NAME; passwords are verified
      against the local Argon2id hash. Successful sign-in sets the session cookie unless
      an MFA challenge is required.
  - name: Authentication Recovery
    description: >-
      Password setup, reset and change and MFA recovery with single-use hashed
      tokens delivered by Office 365 SMTP to XX_DIGI_EMP_MASTER.EMAIL_ADDRESS (the
      Super Administrator: pinned address only; outside production: the approved
      test mailbox only). The token is only ever in the e-mailed link's URL
      fragment. Without SMTP configuration, delivery-dependent requests fail
      closed with 503 DELIVERY_UNAVAILABLE.
  - name: Health
    description: Process and dependency health checks for runtime supervision.
  - name: Access Control
    description: >-
      Request-time authorization (default deny; explicit DENY wins) and RBAC
      administration of roles, the permission catalogue, role grants, user roles
      and direct overrides. Administration requires an MFA-verified session.
  - name: User Administration
    description: >-
      Application accounts for employee-master employees: provisioning (PENDING,
      no password), activation after password setup, disabling and session
      revocation, under the protected administrator hierarchy.
  - name: HR Contractor Employees
    description: Contractor employee report, employee record CRUD, and form lookups.
  - name: HR Periodwise Employees
    description: >-
      Read-only report of the employees attached to a department during a period, with
      server-computed KPIs and chart data.
  - name: HR Interview Assessments
    description: >-
      Interview Assessment Form CRUD (README_interview_assessment_form.md): insert,
      read, update, delete and filtered listing of the four-table record, plus the
      nationality, approved-requisition and interviewer-employee lookups. Requires
      HR.INTERVIEW_ASSESSMENTS:VIEW / CREATE / UPDATE / DELETE
      (default deny without the catalogue grant). STATUS is plain data: written
      'Incomplete' on insert, never updated, and refused for deletion when Approved
      and Passed.
  - name: Employment Offers
    description: >-
      Employment Offer Form CRUD (README_employment_offer_form.md): insert, read,
      update, delete and filtered listing of the two-table record (header + one
      line), plus the approved-candidate, title, allowance, business-unit,
      number-to-Arabic and Hijri-date lookups. Requires
      HR.EMPLOYMENT_OFFERS:VIEW / CREATE / UPDATE / DELETE (default
      deny without the catalogue grant). STATUS is write-once 'Incomplete' on insert
      and only a list filter afterwards; PROBATIONARY_PERIOD(_AR) and the line
      salary-arabic duplicate are insert-only and never updated.
  - name: HR Requisitions
    description: >-
      Personal Requisition Form CRUD (README_personal_requisition_form.md): insert,
      read, update, delete and filtered listing of the single-table record plus its
      attachment rows, and the job-title, requestor, department, replacement-for,
      budget and filter-option lookups. Requires
      HR.REQUISITIONS:VIEW / CREATE / UPDATE / DELETE / MANAGE_ATTACHMENTS (default
      deny without the catalogue grant). REQUISITION_STATUS is plain data: written
      'Draft' on insert and never transitioned â€” no workflow table (XXPHP_WORKFLOW,
      XX_REQ_WF_REC) is read or written. ticketStatus (ATTRIBUTE1) may only be set
      by HR users (server-side XXZP_HR probe); Inprocess/Approved merely gate
      non-HR updates, and only Draft requests can be deleted.
  - name: HR Personnel Record Changes
    description: >-
      CRUD, filtered listing and employee/position lookups for the Personal Status Change Form.
      Requires HR.PERSONNEL_RECORD_CHANGES:VIEW / CREATE / UPDATE / DELETE. STATUS is set to
      DRAFT on creation and is not client writable. This API does not implement workflow actions.
  - name: HR Employee Clearance
    description: >-
      Employee Clearance request CRUD, paginated listing, and employee, approver, and computer
      destination lookups. Each endpoint requires the matching
      HR.EMPLOYEE_CLEARANCE:VIEW / CREATE / UPDATE / DELETE permission;
      VIEW_ALL separately controls all-employee scope and visibility. Ordinary employee scope
      covers the authenticated employee and verified direct reports using PERSON_ID /
      SUPERVISOR_ID. Visibility and writes are scoped to the request employee, not its creator.
      Updates and deletes are restricted to Draft or Rejected requests. No workflow actions,
      approval processing, email, PDF, or attachment APIs are provided.
  - name: HR Employee of the Month
    description: >-
      Employee of the Month nominations, employee/requestor/criteria lookups and filtered
      listing. Requires HR.EMPLOYEE_OF_THE_MONTH:VIEW / CREATE / UPDATE / DELETE.
      Non-HR list results are restricted to nominations created by the authenticated user;
      HR list results include all nominations.
  - name: HR Sick Leave
    description: >-
      Sick Leave requests, employee lookups and attachments. Routes require an authenticated
      session and HR.SICK_LEAVE:VIEW / CREATE / UPDATE / DELETE / MANAGE_ATTACHMENTS. The
      leave type is always "Sick Leave" (legacy form 1076). Without the optional HR-wide
      visibility permission (SICK_LEAVE_HR_RESOURCE_KEY), records remain scoped to the
      authenticated employee or their created requests. Write operations also require CSRF
      validation.
  - name: Ideas
    description: >-
      Idea proposal listing, creation, updates, employee/division/category lookups and
      feasibility calculation. All operations require an authenticated session and
      HR.IDEAS:VIEW / CREATE / UPDATE / DELETE / MANAGE_ATTACHMENTS (feasibility uses UPDATE).
      Non-HR users can access only ideas they created; HR users can access all ideas. Soft deletion and
      attachment upload/deletion are currently unavailable and return conflicts.
  - name: Employee Survey
    description: >-
      Anonymous employee survey submission and authenticated response/report reads. The
      protected routes require `HR.SURVEY_REPORTS` (VIEW for reads, DELETE for deletion). The
      survey router is mounted at `/survey`.
  - name: Project Charters
    description: >-
      Project Charter CRUD, approved-idea and employee lookups, and reward read/write routes.
      Routes require the configured `HR.PROJECT_CHARTERS` resource and action.
      Charters are created with the database-generated header ID; reward writes remain disabled
      pending approved grading thresholds.
  - name: HR Business Visiting Visa Letters
    description: >-
      Business Visiting Visa Letter CRUD, employee lookups, form options, print-preview data,
      and CSV export. Every route requires an authenticated session and the matching
      `HR.BUSINESS_VISA_LETTERS:VIEW / CREATE / UPDATE / DELETE` permission. Write requests
      additionally require the session-bound CSRF token. Authorization fails closed when the
      required resource/action is not active in the permission catalogue.
  - name: Arabic Salary Certificates
    description: >-
      Arabic salary certificate CRUD, employee and approver lookups, and HTML printing.
      Routes require the corresponding `HR.SALARY_CERTIFICATES_AR:VIEW / CREATE / UPDATE /
      DELETE` permission. Employee and salary snapshot values are loaded from the employee
      master; only DRAFT certificates can be updated or deleted.
  - name: English Salary Certificates
    description: >-
      English salary certificate CRUD, employee and approver lookups, and printable HTML.
      Routes require the corresponding `HR.SALARY_CERTIFICATES:VIEW / CREATE / UPDATE /
      DELETE` permission. Employee identity, employment, and salary snapshot values are
      loaded from the employee master; only DRAFT certificates can be updated or deleted.
  - name: HR Warning Letters
    description: >-
      Warning Letter CRUD, employee lookups, and bilingual print data. Routes require an
      authenticated session and the matching `HR.WARNING_LETTERS:VIEW / CREATE / UPDATE /
      DELETE` permission. State-changing requests also require the session-bound CSRF token.
      Employee details, warning number, reference number, status, and audit fields are
      server-managed.
  - name: HR Tourist Visa Letters
    description: >-
      Tourist Visa Letter CRUD, employee/country/approver lookups, and bilingual print data.
      Routes require an authenticated session and the matching
      `HR.TOURIST_VISA_LETTERS:VIEW / CREATE / UPDATE / DELETE` permission. State-changing
      requests also require the session-bound CSRF token. Employee identity and salary are
      loaded from the employee master at creation; UUID, reference number, and audit fields
      are handled by the server.
  - name: Workflow Manager
    description: >-
      Master Workflow Manager, Phase 1 package M1: Form Registry and Data Source
      Registry over XX_ZRV_WF_FORMS and XX_ZRV_WF_DATA_SOURCES, with read-only
      version metadata (XX_ZRV_WF_SOURCE_VERSIONS, XX_ZRV_WF_FORM_VERSIONS).
      Configuration only: no workflow instances, tasks or notifications are created.
      Requires WORKFLOW_MANAGER.* permissions (default deny until the catalogue is
      registered and granted).
paths:
  /api/v1/auth/password/policy:
    get:
      operationId: getPasswordPolicy
      tags: [Authentication]
      summary: Password policy
      description: >-
        Returns the approved password policy for new passwords. No authentication
        required. Login itself verifies the submitted password as typed and does
        not re-apply complexity rules.
      responses:
        '200':
          description: The password policy.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PasswordPolicy'
              example:
                success: true
                data:
                  minLength: 8
                  maxLength: 128
                  requireUppercase: true
                  requireLowercase: true
                  requireDigit: true
                  requireSpecialCharacter: true
                  expiryDays: 90
                  expiryReminderDays: [14, 7, 1]
                meta:
                  requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Sign in with username and password
      description: >-
        Resolves `username` case-insensitively (after trimming) to exactly one
        employee-master record, links it by employee number to one local account,
        and verifies the password with Argon2id. On success a new session is
        created (8-hour absolute lifetime, 30-minute idle timeout) and returned
        as an HttpOnly, Secure session cookie; any session cookie already sent by
        the browser is revoked.


        Sign-in requires an ACTIVE account, `CURRENT_EMP_FLAG = 'Y'` and a
        termination date that is either absent or after today's date in
        Asia/Riyadh (a termination date of today refuses sign-in).


        Every credential, account-state and employment-eligibility failure
        returns the same `401 AUTHENTICATION_FAILED` response, so the response
        never reveals whether a username exists or why it was refused. Five
        consecutive wrong passwords lock the account for 15 minutes. `403`
        responses are returned only after the correct password was supplied.
        Failed and denied attempts are recorded in the security audit log
        (`LOGIN_FAILED`, `ACCOUNT_LOCKED`) independently of the rejected request.


        Rate limited per client IP (default 60 attempts per minute, per server
        process). No CSRF token is required (there is no session yet); the
        Origin check applies.


        **MFA.** When MFA is mandatory (Zaid, protected administrator roles, any
        effective security-administration permission) or voluntarily enrolled,
        a correct password does **not** create a session: the response is
        `authenticated: false` with an MFA challenge (5-minute, single-use,
        HttpOnly `__Host-zr_mfa` cookie plus its CSRF token). Complete it with
        `POST /api/v1/auth/mfa/verify`, or for a first-time authenticator with
        `/mfa/enrollment` and `/mfa/enrollment/confirm`. The consecutive-failure
        counter is reset only after MFA succeeds. If the server has no MFA key,
        such accounts receive `403 MFA_REQUIRED` (fail closed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: >-
            Either signed in (`authenticated: true`; the session cookie is set and
            the body contains the profile, session limits, password expiry and the
            CSRF token), or the password was correct and MFA is still required
            (`authenticated: false`; only the MFA challenge cookie is set).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: >-
                Signed in: `__Host-zr_session=<opaque token>; Path=/; Expires=<absolute
                expiry>; HttpOnly; Secure; SameSite=Lax`. MFA required:
                `__Host-zr_mfa=<opaque challenge token>; Path=/; Expires=<challenge
                expiry>; HttpOnly; Secure; SameSite=Lax`. Cookie names are configurable.
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/LoginResult'
                          - $ref: '#/components/schemas/MfaChallenge'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Sign-in failed. Deliberately identical for every failure reason.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: AUTHENTICATION_FAILED
                  message: Sign-in failed. Check your username and password, or try again later.
                meta:
                  requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '403':
          description: >-
            The password was correct but no session or challenge can be issued.
            `MFA_REQUIRED`: MFA is required but the server has no MFA key
            configured (fail closed). `PASSWORD_EXPIRED`: the password is 90 or
            more days old, or no password-change time is recorded.
            `CSRF_REJECTED`: the Origin check failed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                mfaRequired:
                  value:
                    success: false
                    error:
                      code: MFA_REQUIRED
                      message: >-
                        This account requires multi-factor verification, which is not
                        available right now. Contact your administrator.
                    meta:
                      requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
                passwordExpired:
                  value:
                    success: false
                    error:
                      code: PASSWORD_EXPIRED
                      message: Your password has expired and must be changed before you can sign in.
                    meta:
                      requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/mfa/enrollment:
    post:
      operationId: startMfaEnrollment
      tags: [Authentication]
      summary: Start first-time authenticator enrollment
      description: >-
        For a user in an MFA challenge who has no authenticator yet. Returns the
        TOTP secret and `otpauth://` URI to show once (for example as a QR code).
        Nothing is stored until `/mfa/enrollment/confirm` proves possession. The
        secret is derived from the challenge, so repeating this call within the
        same challenge returns the same secret; a new sign-in gives a new one.
        Never replaces an existing authenticator (`409 MFA_ALREADY_ENROLLED`).
      security:
        - mfaChallengeCookie: []
      parameters:
        - $ref: '#/components/parameters/MfaCsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Enrollment secret (shown once; never logged).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MfaEnrollment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/MfaChallengeInvalid'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '409':
          $ref: '#/components/responses/MfaConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/MfaUnavailable'
  /api/v1/auth/mfa/enrollment/confirm:
    post:
      operationId: confirmMfaEnrollment
      tags: [Authentication]
      summary: Confirm authenticator enrollment and sign in
      description: >-
        Verifies a code from the new authenticator (proof of possession), stores
        the encrypted secret, revokes every other session of the user (MFA change)
        and issues an MFA-verified session. A wrong code counts toward the
        5-failure / 15-minute lockout.
      security:
        - mfaChallengeCookie: []
      parameters:
        - $ref: '#/components/parameters/MfaCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
      responses:
        '200':
          $ref: '#/components/responses/MfaSignedIn'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/MfaVerificationFailed'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '409':
          $ref: '#/components/responses/MfaConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/MfaUnavailable'
  /api/v1/auth/mfa/verify:
    post:
      operationId: verifyMfa
      tags: [Authentication]
      summary: Verify an authenticator code and sign in
      description: >-
        Verifies a 6-digit TOTP code (SHA-1, 30-second steps, Â±1 step tolerance)
        for the challenge's user. Each time step is accepted only once (replays
        are refused). On success the challenge is revoked and an MFA-verified
        session is issued (15-minute idle timeout for privileged users, 30 minutes
        otherwise). Wrong or replayed codes count toward the lockout; a lock ends
        the challenge.
      security:
        - mfaChallengeCookie: []
      parameters:
        - $ref: '#/components/parameters/MfaCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
      responses:
        '200':
          $ref: '#/components/responses/MfaSignedIn'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/MfaVerificationFailed'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '409':
          $ref: '#/components/responses/MfaConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/MfaUnavailable'
  /api/v1/auth/mfa/replacement:
    post:
      operationId: startMfaReplacement
      tags: [Authentication]
      summary: Start replacing the enrolled authenticator
      description: >-
        For a signed-in user whose MFA was verified on the current session within
        the last 5 minutes (sign in again otherwise). Returns a new candidate TOTP
        secret, derived under a separate purpose from enrollment and bound to this
        session and the stored secret; nothing is stored until
        `/mfa/replacement/confirm`. Refusals are audited as `ACCESS_DENIED`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: New authenticator setup material (shown once; never logged).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MfaEnrollment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/MfaRecentVerificationRequired'
        '409':
          $ref: '#/components/responses/MfaConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/MfaUnavailable'
  /api/v1/auth/mfa/replacement/confirm:
    post:
      operationId: confirmMfaReplacement
      tags: [Authentication]
      summary: Confirm the new authenticator and replace the old one
      description: >-
        Verifies a code from the NEW authenticator, then atomically replaces the
        stored secret (only if it is unchanged since it was read) and revokes every
        session and MFA challenge of the user, including the current session. Both
        cookies are cleared; sign in again with the password and the new
        authenticator. Codes from the old authenticator are never accepted again.
        Recorded as `SESSION_REVOKED` with reason `MFA_REPLACED`. A wrong code is
        audited as `ACCESS_DENIED` and counts toward the 5-failure lockout; a
        lockout ends every session of the user.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCodeRequest'
      responses:
        '200':
          description: Authenticator replaced; all sessions revoked and cookies cleared.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              description: Session and MFA challenge cookies cleared.
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MfaReplacementResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/MfaVerificationFailed'
        '403':
          $ref: '#/components/responses/MfaRecentVerificationRequired'
        '409':
          $ref: '#/components/responses/MfaConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/MfaUnavailable'
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Authentication]
      summary: Current user and session
      description: >-
        Returns the signed-in user's safe profile and session state. The session,
        account status, employment eligibility and MFA requirement are re-checked
        in the database on every request; a session whose account was disabled,
        whose employee became ineligible (including a termination date reaching
        today in Asia/Riyadh), or whose user now requires MFA is revoked
        (`SESSION_REVOKED`). Absolute and idle expiry are recorded as
        `SESSION_EXPIRED`. An expired password does not end a valid session; it
        is reported in `password.expired`. No business permission is required.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The current user.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [Authentication]
      summary: CSRF token for the current session
      description: >-
        Returns the synchronizer token bound to the current session, for clients
        that did not keep the token from the login response (for example after a
        page reload). Send it in the `X-CSRF-Token` header on authenticated
        state-changing requests.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The CSRF token.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CsrfToken'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
