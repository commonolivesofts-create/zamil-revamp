      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSetupIssueRequest'
      responses:
        '202':
          description: Accepted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenIssued'
        '400':
          $ref: '#/components/responses/RecoveryError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RecoveryNotApplicable'
        '429':
          $ref: '#/components/responses/RecoveryThrottled'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DeliveryUnavailable'
  /api/v1/users/{userId}/recovery:
    post:
      operationId: issueRecovery
      tags: [User Administration]
      summary: Send a password-reset or MFA-recovery link
      description: >-
        Administrator-assisted recovery (docs/07 §5). Requires
        `SECURITY_ADMINISTRATION.ACCOUNT_RECOVERY:ISSUE`, the X-CSRF-Token header
        and explicit confirmation. Ordinary employees: any holder of the permission.
        Main Administrators, Administrators and other security-permission holders:
        only the Super Administrator with MFA verified within 10 minutes (direct
        authorization, no approval queue). Never for the Super Administrator account
        (self-recovery only) or the actor. Audited as ACTION_TOKEN_ISSUED.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryIssueRequest'
      responses:
        '202':
          description: Accepted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenIssued'
        '400':
          $ref: '#/components/responses/RecoveryError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RecoveryNotApplicable'
        '429':
          $ref: '#/components/responses/RecoveryThrottled'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DeliveryUnavailable'
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Liveness probe
      description: >-
        Confirms that the API process is running and able to respond. Does not
        check Oracle or any other dependency. No authentication required.
      responses:
        '200':
          description: The process is alive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Liveness'
              example:
                success: true
                data:
                  status: UP
                meta:
                  requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '500':
          $ref: '#/components/responses/InternalError'
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Readiness probe
      description: >-
        Confirms that the instance can serve work: both Oracle connection pools
        (LOW and HIGH) must complete a bounded, read-only check. Results are reused
        for a short period and concurrent requests share one check, so frequent
        probes cannot exhaust the pools. No authentication required. Database
        identities, hosts and driver errors are never returned.
      responses:
        '200':
          description: The instance is ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Readiness'
              example:
                success: true
                data:
                  status: READY
                  database:
                    LOW: UP
                    HIGH: UP
                meta:
                  requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '503':
          description: A required database pool is unavailable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: SERVICE_UNAVAILABLE
                  message: The service is not ready
                  details:
                    - field: database.HIGH
                      message: Database pool is unavailable
                meta:
                  requestId: 3f8b2c1e-6a4d-4e2b-9b7a-1c2d3e4f5a6b
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-zr_session
      description: >-
        Opaque session token set by `POST /api/v1/auth/login` (HttpOnly; the
        browser sends it automatically). The cookie name is deployment
        configurable. This scheme describes authentication only; it does not
        imply any business permission.
    mfaChallengeCookie:
      type: apiKey
      in: cookie
      name: __Host-zr_mfa
      description: >-
        Opaque MFA challenge token set by `POST /api/v1/auth/login` after a correct
        password when MFA is required. Valid for 10 minutes, single use, accepted
        only by the `/api/v1/auth/mfa/*` endpoints and never as a session.
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF token from the login response or `GET /api/v1/auth/csrf`.
      schema:
        type: string
    MfaCsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Challenge-bound CSRF token from the login response that issued the challenge.
      schema:
        type: string
    RoleId:
      name: roleId
      in: path
      required: true
      description: NUMBER(19,0) identifier as a decimal string.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,18}$'
    UserId:
      name: userId
      in: path
      required: true
      description: NUMBER(19,0) identifier as a decimal string.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,18}$'
    ModuleId:
      name: moduleId
      in: path
      required: true
      description: NUMBER(19,0) identifier as a decimal string.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,18}$'
    ResourceId:
      name: resourceId
      in: path
      required: true
      description: NUMBER(19,0) identifier as a decimal string.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,18}$'
    PermissionId:
      name: permissionId
      in: path
      required: true
      description: NUMBER(19,0) identifier as a decimal string.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,18}$'
    SessionId:
      name: sessionId
      in: path
      required: true
      description: NUMBER(19,0) identifier as a decimal string.
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,18}$'
  headers:
    RequestId:
      description: >-
        Request correlation ID. A valid incoming X-Request-Id (8–64 characters of
        A–Z, a–z, 0–9, '.', '_' or '-') is reused; otherwise a UUID is generated.
      schema:
        type: string
  schemas:
    PasswordPolicy:
      type: object
      required:
        - minLength
        - maxLength
        - requireUppercase
        - requireLowercase
        - requireDigit
        - requireSpecialCharacter
        - expiryDays
        - expiryReminderDays
      properties:
        minLength:
          type: integer
          description: Minimum length in Unicode code points.
        maxLength:
          type: integer
        requireUppercase:
          type: boolean
        requireLowercase:
          type: boolean
        requireDigit:
          type: boolean
        requireSpecialCharacter:
          type: boolean
          description: Any character that is not a letter or digit, including a space.
        expiryDays:
          type: integer
          description: Password age at which a new login is refused.
        expiryReminderDays:
          type: array
          items:
            type: integer
          description: Days before expiry at which reminders are sent (reminders are not yet implemented).
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
          description: Employee-master USER_NAME; matched case-insensitively after trimming.
        password:
          type: string
          minLength: 1
          maxLength: 256
          format: password
          description: Verified exactly as typed (not trimmed).
    AuthUser:
      type: object
      required: [id, username, employeeNumber, fullName, email, jobTitle, department]
      properties:
        id:
          type: string
          description: Local account ID (NUMBER(19,0), transported as a string to preserve precision).
          examples: ['105']
        username:
          type: [string, 'null']
        employeeNumber:
          type: string
        fullName:
          type: [string, 'null']
        email:
          type: [string, 'null']
        jobTitle:
          type: [string, 'null']
        department:
          type: [string, 'null']
    SessionInfo:
      type: object
      required: [expiresAt, idleTimeoutSeconds, mfaVerified]
      properties:
        expiresAt:
          type: string
          format: date-time
          description: Absolute session expiry (UTC).
        idleTimeoutSeconds:
          type: integer
          description: Inactivity period after which the session ends (accurate to about one minute).
        mfaVerified:
          type: boolean
    PasswordState:
      type: object
      required: [expired, expiresAt]
      properties:
        expired:
          type: boolean
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: When the password reaches 90 days (UTC); null if its change time is unknown.
    CsrfToken:
      type: object
      required: [token, headerName]
      properties:
        token:
          type: string
        headerName:
          type: string
          const: X-CSRF-Token
    MfaChallenge:
      type: object
      required: [authenticated, mfa, csrf]
      properties:
        authenticated:
          const: false
        mfa:
          type: object
          required: [required, enrollmentRequired, expiresAt]
          properties:
            required:
              const: true
            enrollmentRequired:
              type: boolean
              description: True when no authenticator is set up yet (use the enrollment endpoints).
            expiresAt:
              type: string
              format: date-time
              description: Challenge expiry (UTC), 10 minutes after the password was verified.
        csrf:
          $ref: '#/components/schemas/CsrfToken'
    MfaEnrollment:
      type: object
      required:
        [secret, otpauthUri, issuer, accountName, algorithm, digits, periodSeconds, expiresAt]
      properties:
        secret:
          type: string
          description: >-
            Base32 TOTP secret (160 bits). Show once; never store client-side or copy
            into chats, tickets or logs.
        otpauthUri:
          type: string
          description: >-
            Key URI for authenticator apps (render as a QR code). The label is
            `<issuer>:<accountName>`, each URL-encoded, joined by a literal colon.
        issuer:
          type: string
          description: Issuer shown by the authenticator app.
        accountName:
          type: string
          description: Account name shown by the authenticator app (the USER_NAME).
        algorithm:
          const: SHA1
        digits:
          const: 6
        periodSeconds:
          const: 30
        expiresAt:
          type: string
          format: date-time
          description: >-
            Confirm before this time: the challenge expiry (enrollment), or 10 minutes
            after MFA was verified on the session (replacement).
    MfaReplacementResult:
      type: object
      required: [replaced, sessionsRevoked, reauthenticationRequired]
      properties:
        replaced:
          const: true
        sessionsRevoked:
          type: integer
          description: Sessions and challenges of the user revoked, including the current session.
        reauthenticationRequired:
          const: true
    MfaCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^\d{6}$'
          description: The current 6-digit code from the authenticator app.
    LoginResult:
      type: object
      required: [authenticated, user, session, password, csrf]
      properties:
        authenticated:
          const: true
        user:
          $ref: '#/components/schemas/AuthUser'
        session:
          $ref: '#/components/schemas/SessionInfo'
        password:
          $ref: '#/components/schemas/PasswordState'
        csrf:
          $ref: '#/components/schemas/CsrfToken'
    CurrentUser:
      type: object
      required: [user, session, password]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        session:
          $ref: '#/components/schemas/SessionInfo'
        password:
          $ref: '#/components/schemas/PasswordState'
    Id:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
    Role:
      type: object
      required: [roleId, roleCode, roleName, isActive]
      properties:
        roleId:
          $ref: '#/components/schemas/Id'
        roleCode:
          type: string
        roleName:
          type: string
        description:
          type: [string, 'null']
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: [string, 'null']
          format: date-time
    RoleCreateRequest:
      type: object
      additionalProperties: false
      required: [roleCode, roleName]
      properties:
        roleCode:
          type: string
          maxLength: 60
          pattern: '^[A-Z][A-Z0-9_]*$'
        roleName:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 500
    RoleUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        roleName:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 500
    Pagination:
      type: object
      required: [page, limit, total, totalPages, hasNextPage, hasPreviousPage]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
    PaginatedRoles:
      type: object
      required: [success, data, pagination, meta]
      properties:
        success:
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        pagination:
          $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    CatalogModule:
      type: object
      properties:
        moduleId:
          $ref: '#/components/schemas/Id'
        moduleCode:
          type: string
        moduleName:
          type: string
        displayOrder:
          type: integer
        isActive:
          type: boolean
        resources:
          type: array
          items:
            type: object
            properties:
              resourceId:
                $ref: '#/components/schemas/Id'
              resourceCode:
                type: string
              resourceName:
                type: string
              isActive:
                type: boolean
              permissions:
                type: array
                items:
                  type: object
                  properties:
                    permissionId:
                      $ref: '#/components/schemas/Id'
                    actionCode:
                      type: string
                    description:
                      type: [string, 'null']
                    isActive:
                      type: boolean
    ModuleCreateRequest:
      type: object
      additionalProperties: false
      required: [moduleCode, moduleName]
      properties:
        moduleCode:
          type: string
          maxLength: 60
          pattern: '^[A-Z][A-Z0-9_]*$'
        moduleName:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 500
        displayOrder:
          type: integer
          minimum: 0
          maximum: 99999
    ResourceCreateRequest:
      type: object
      additionalProperties: false
      required: [resourceCode, resourceName]
      properties:
        resourceCode:
          type: string
          maxLength: 80
          pattern: '^[A-Z][A-Z0-9_]*$'
        resourceName:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 500
    PermissionCreateRequest:
      type: object
      additionalProperties: false
      required: [actionCode]
      properties:
        actionCode:
          type: string
          maxLength: 40
          pattern: '^[A-Z][A-Z0-9_]*$'
        description:
          type: [string, 'null']
          maxLength: 500
    ActivationRequest:
      type: object
      additionalProperties: false
      required: [isActive]
      properties:
        isActive:
          type: boolean
    PermissionKey:
      type: object
      required: [permissionId, moduleCode, resourceCode, actionCode]
      properties:
        permissionId:
          $ref: '#/components/schemas/Id'
        moduleCode:
          type: string
        resourceCode:
          type: string
        actionCode:
          type: string
    RolePermission:
      allOf:
        - $ref: '#/components/schemas/PermissionKey'
        - type: object
          properties:
            isActive:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: [string, 'null']
              format: date-time
    EffectivePermission:
      allOf:
        - $ref: '#/components/schemas/PermissionKey'
        - type: object
          properties:
            viaRole:
              type: boolean
            viaOverride:
              type: boolean
    MyPermissions:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/Id'
        mfaVerified:
          type: boolean
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/EffectivePermission'
    UserRole:
      type: object
      properties:
        roleId:
          $ref: '#/components/schemas/Id'
        roleCode:
          type: string
        roleName:
          type: string
        roleActive:
          type: boolean
        isActive:
          type: boolean
        expiresAt:
          type: [string, 'null']
          format: date-time
        effective:
          type: boolean
          description: Active, unexpired membership of an active role.
    UserRoleAssignRequest:
      type: object
      additionalProperties: false
      properties:
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: ISO 8601 instant in the future; null or absent for no expiry.
    UserOverride:
